<style>
:root{
  --bg:#ECE6D6; --surface:#FAF7EF; --surface-2:#F1ECDF; --sunk:rgba(40,36,28,.06);
  --ink:#201E19; --ink-2:#6F6A5E; --ink-3:#A9A393; --sep:rgba(40,36,28,.10);
  --navy:#16332C; --navy-2:#24493F; --navy-soft:rgba(22,51,44,.09);
  --pro:#93602F; --pro-soft:rgba(147,96,47,.13);
  --perso:#3F6E86; --perso-soft:rgba(63,110,134,.13);
  --late:#B0512C; --late-soft:rgba(176,81,44,.12);
  --ok:#2F7A55; --ok-soft:rgba(47,122,85,.12);
  --r:16px; --r-sm:11px;
  --shadow:0 1px 2px rgba(30,26,20,.05), 0 4px 14px rgba(30,26,20,.04);
  --nav-h:62px;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg); color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; overflow-x:hidden;}
body{min-height:100vh; min-height:100dvh;}
button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none;}
input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink);}
a{color:inherit;}
.hidden{display:none !important;}
.num{font-variant-numeric:tabular-nums;}

/* ---------- Layout ---------- */
#app{max-width:680px; margin:0 auto; padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);}
header.top{position:sticky; top:0; z-index:20; background:rgba(236,230,214,.88); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;}
.top-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.eyebrow{font-size:13px; color:var(--ink-2); font-weight:500; text-transform:capitalize;}
h1.title{font-size:30px; line-height:1.1; font-weight:700; letter-spacing:-.02em; margin-top:2px;}
.back-btn{display:flex; align-items:center; gap:2px; color:var(--navy); font-size:16px; font-weight:500; margin:0 0 4px -6px; padding:4px 6px;}
.back-btn svg{width:20px; height:20px;}
.mic-btn{width:44px; height:44px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow:0 4px 14px rgba(22,51,44,.28); transition:transform .12s ease;}
.mic-btn:active{transform:scale(.94);}
.mic-btn svg{width:21px; height:21px;}
.status-line{font-size:12px; color:var(--ink-2); margin-top:4px; min-height:0;}
.status-line.err{color:var(--late);}
main{padding:6px 16px 0;}
.view{display:none;}
.view.active{display:block; animation:fade .18s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}

/* ---------- Sections & lists ---------- */
.sec-label{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; font-weight:600; color:var(--ink-2);
  text-transform:uppercase; letter-spacing:.04em; margin:22px 4px 8px;}
.sec-label:first-child{margin-top:8px;}
.sec-label .act{font-size:14px; font-weight:500; text-transform:none; letter-spacing:0; color:var(--navy);}
.group{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden;}
.row{display:flex; align-items:center; gap:12px; padding:12px 14px; position:relative; min-height:52px; width:100%; text-align:left;}
.row + .row::before{content:''; position:absolute; top:0; left:52px; right:0; height:1px; background:var(--sep);}
.group.flat .row + .row::before{left:14px;}
button.row:active, .row.tap:active{background:var(--sunk);}
.row-body{flex:1; min-width:0;}
.row-title{font-size:15.5px; line-height:1.3; overflow-wrap:anywhere;}
.row-sub{font-size:12.5px; color:var(--ink-2); margin-top:3px; display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center;}
.row.done .row-title{color:var(--ink-3); text-decoration:line-through;}
.chev{color:var(--ink-3); flex-shrink:0;} .chev svg{width:8px; height:13px;}
.empty{padding:22px 16px; text-align:center; color:var(--ink-2); font-size:14px; line-height:1.45;}
.group > .empty{padding:20px 16px;}

.check{width:26px; height:26px; border-radius:50%; border:1.8px solid var(--ink-3); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s ease;}
.check.pro{border-color:rgba(147,96,47,.55);} .check.perso{border-color:rgba(63,110,134,.55);}
.check.on{background:var(--navy); border-color:var(--navy);}
.check.on::after{content:''; width:10px; height:6px; border-left:2.2px solid #fff; border-bottom:2.2px solid #fff; transform:translate(0,-1px) rotate(-45deg);}
.pill{font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:20px; background:var(--sunk); color:var(--ink-2); white-space:nowrap;}
.pill.pro{background:var(--pro-soft); color:var(--pro);} .pill.perso{background:var(--perso-soft); color:var(--perso);}
.pill.late{background:var(--late-soft); color:var(--late);} .pill.ok{background:var(--ok-soft); color:var(--ok);}
.pill.navy{background:var(--navy-soft); color:var(--navy);}
.dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;} .dot.pro{background:var(--pro);} .dot.perso{background:var(--perso);}
.prio-h{color:var(--late); font-weight:700;}

/* ---------- Cards ---------- */
.card{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); padding:16px;}
.hero{background:var(--navy); color:#F3EEDD; border-radius:20px; padding:18px; box-shadow:0 8px 24px rgba(22,51,44,.22);}
.hero .k{font-size:12px; letter-spacing:.06em; text-transform:uppercase; opacity:.7; font-weight:600;}
.hero .t{font-size:21px; font-weight:650; line-height:1.25; margin-top:6px; letter-spacing:-.01em;}
.hero .m{font-size:13.5px; opacity:.78; margin-top:6px;}
.hero .actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
.hero .actions button{background:rgba(243,238,221,.14); color:#F3EEDD; border-radius:20px; padding:8px 14px; font-size:14px; font-weight:600;}
.hero .actions button.primary{background:#F3EEDD; color:var(--navy);}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
.stat{background:var(--surface); border-radius:14px; padding:12px; box-shadow:var(--shadow); text-align:left;}
.stat b{display:block; white-space:nowrap; font-size:22px; font-weight:700; letter-spacing:-.01em;}
.stat span{font-size:12px; color:var(--ink-2);}
.stat.alert b{color:var(--late);}
.weather{display:flex; align-items:center; gap:14px;}
.weather .temp{font-size:34px; font-weight:300; letter-spacing:-.03em;}
.weather .desc{font-size:14px; font-weight:600;}
.weather .sub{font-size:12.5px; color:var(--ink-2); margin-top:2px;}
.wx-days{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:12px; padding-top:12px; border-top:1px solid var(--sep); text-align:center; font-size:12px; color:var(--ink-2);}
.wx-days b{display:block; color:var(--ink); font-size:13px; margin:3px 0;}
.wx-ico{font-size:30px; line-height:1;}

/* ---------- Segmented, chips, search ---------- */
.seg{display:flex; background:var(--sunk); border-radius:10px; padding:2px; gap:2px;}
.seg button{flex:1; padding:8px 6px; font-size:14px; font-weight:500; color:var(--ink-2); border-radius:8px;}
.seg button.on{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.08);}
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0; scrollbar-width:none;} .chips::-webkit-scrollbar{display:none;}
.chip{padding:7px 13px; border-radius:20px; background:var(--surface); box-shadow:var(--shadow); font-size:13.5px; font-weight:500; color:var(--ink-2); white-space:nowrap;}
.chip.on{background:var(--navy); color:#fff;}
.search{display:flex; align-items:center; gap:8px; background:var(--sunk); border-radius:11px; padding:9px 12px; margin:12px 0;}
.search svg{width:17px; height:17px; color:var(--ink-3); flex-shrink:0;}
.search input{border:none; background:none; outline:none; flex:1; min-width:0;}
.toolbar{display:flex; flex-direction:column; gap:10px; margin:8px 0 4px;}

/* ---------- Planning ---------- */
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:4px;}
.wd{display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0; border-radius:12px; font-size:11.5px; color:var(--ink-2); position:relative;}
.wd b{font-size:17px; color:var(--ink); font-weight:600;}
.wd.today b{color:var(--navy);}
.wd.sel{background:var(--navy);} .wd.sel, .wd.sel b{color:#fff;}
.wd .mk{width:5px; height:5px; border-radius:50%; background:var(--ink-3);}
.wd.sel .mk{background:#fff;} .wd .mk.none{visibility:hidden;}
.month{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; margin-top:8px;}
.month .h{font-size:11px; color:var(--ink-3); padding:4px 0; font-weight:600;}
.month button{aspect-ratio:1; border-radius:10px; font-size:14.5px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;}
.month button.out{color:var(--ink-3);} .month button.today{color:var(--navy); font-weight:700;}
.month button.sel{background:var(--navy); color:#fff;}
.month button i{width:4px; height:4px; border-radius:50%; background:var(--ink-3);} .month button.sel i{background:#fff;}
.tl{position:relative;}
.tl-row{display:flex; gap:10px; align-items:stretch;}
.tl-time{width:50px; flex-shrink:0; text-align:right; font-size:12.5px; color:var(--ink-2); padding-top:15px; font-variant-numeric:tabular-nums;}
.tl-time b{display:block; color:var(--ink); font-size:13.5px; font-weight:600;}
.tl-item{flex:1; min-width:0; margin-bottom:8px;}
.tl-item .group{border-left:4px solid var(--ink-3);}
.tl-item.pro .group{border-left-color:var(--pro);} .tl-item.perso .group{border-left-color:var(--perso);}
.tl-item.now .group{box-shadow:0 0 0 2px var(--navy), var(--shadow);}
.tl-break{display:flex; gap:10px; align-items:center; margin:2px 0 10px; color:var(--ink-3); font-size:12.5px;}
.tl-break .tl-time{padding-top:0;}
.tl-break span.line{flex:1; height:1px; background:var(--sep);}
.notice{background:var(--late-soft); color:var(--late); border-radius:var(--r-sm); padding:12px 14px; font-size:13.5px; line-height:1.45; margin-top:12px;}
.notice b{display:block; margin-bottom:4px;}

/* ---------- Dossiers ---------- */
.totals{background:var(--navy); color:#F3EEDD; border-radius:var(--r); padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; box-shadow:0 8px 22px rgba(22,51,44,.2);}
.totals small{display:block; font-size:12px; opacity:.68;}
.totals b{font-size:18px; font-weight:650; font-variant-numeric:tabular-nums;}
.totals .full{grid-column:1/-1;}
.bar{height:5px; border-radius:6px; background:var(--sunk); overflow:hidden; margin-top:8px;}
.bar i{display:block; height:100%; background:var(--navy); border-radius:6px;}
.money{font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums;}
.money.due{color:var(--late); font-weight:600;}

/* ---------- News ---------- */
.news-item{display:block; text-decoration:none;}
.news-item .src{font-size:12px; color:var(--ink-2); margin-top:3px;}

/* ---------- Bottom nav ---------- */
nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:30; background:rgba(250,247,239,.88); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-top:.5px solid rgba(40,36,28,.15); padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);}
nav.tabs .in{max-width:680px; margin:0 auto; display:flex;}
nav.tabs button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 2px; color:var(--ink-3); font-size:10.5px; font-weight:600; position:relative;}
nav.tabs button svg{width:24px; height:24px;}
nav.tabs button.on{color:var(--navy);}
nav.tabs .badge{position:absolute; top:1px; left:calc(50% + 6px); min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--late); color:#fff; font-size:10.5px; line-height:17px; text-align:center;}
.fab{position:fixed; right:max(16px, calc(50% - 340px + 16px)); bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px); z-index:29;
  width:56px; height:56px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(22,51,44,.32); transition:transform .12s ease;}
.fab:active{transform:scale(.94);} .fab svg{width:26px; height:26px;}
body.sheet-open .fab{display:none;}

/* ---------- Sheet ---------- */
.overlay{position:fixed; inset:0; z-index:100; background:rgba(20,18,14,.38); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease;}
.overlay.open{opacity:1; pointer-events:auto;}
.sheet{width:100%; max-width:680px; max-height:92vh; max-height:92dvh; overflow-y:auto; background:var(--bg); border-radius:22px 22px 0 0; padding:0 16px calc(env(safe-area-inset-bottom) + 22px);
  transform:translateY(30px); transition:transform .22s cubic-bezier(.2,.8,.2,1); overscroll-behavior:contain;}
.overlay.open .sheet{transform:none;}
.sheet-head{position:sticky; top:0; background:var(--bg); z-index:2; padding:8px 0 10px;}
.grip{width:38px; height:5px; border-radius:4px; background:rgba(40,36,28,.18); margin:0 auto 10px;}
.sheet-nav{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.sheet-nav h3{font-size:17px; font-weight:650; text-align:center; flex:1;}
.sheet-nav button{font-size:16px; color:var(--navy); padding:6px 2px; min-width:70px; text-align:left;}
.sheet-nav button.primary{font-weight:650; text-align:right;}
.sheet-nav button:disabled{color:var(--ink-3);}
.form{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden;}
.field{display:flex; align-items:center; gap:10px; padding:11px 14px; position:relative; min-height:50px;}
.field + .field::before{content:''; position:absolute; top:0; left:14px; right:0; height:1px; background:var(--sep);}
.field label{font-size:15px; width:118px; flex-shrink:0; color:var(--ink);}
.field input,.field select,.field textarea{flex:1; min-width:0; border:none; background:none; outline:none; text-align:right; padding:2px 0;}
.field textarea{text-align:left; resize:vertical; min-height:70px;}
.field.stack{flex-direction:column; align-items:stretch; gap:6px;}
.field.stack label{width:auto; font-size:13px; color:var(--ink-2);}
.field.stack input,.field.stack textarea{text-align:left;}
.field select{-webkit-appearance:none; appearance:none; color:var(--navy);}
.form-label{font-size:13px; color:var(--ink-2); margin:4px 6px 7px; text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
.presets{display:flex; gap:6px; flex-wrap:wrap; padding:0 14px 12px;}
.presets button{padding:6px 11px; border-radius:16px; background:var(--sunk); font-size:13.5px; font-weight:500; color:var(--ink-2);}
.presets button.on{background:var(--navy); color:#fff;}
.btn{display:block; width:100%; padding:14px; border-radius:14px; font-size:16px; font-weight:650; text-align:center; background:var(--navy); color:#fff; margin-top:8px;}
.btn.ghost{background:var(--surface); color:var(--navy); box-shadow:var(--shadow);}
.btn.danger{background:var(--surface); color:var(--late); box-shadow:var(--shadow);}
.btn-row{display:flex; gap:8px;} .btn-row .btn{flex:1;}
.smart{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); padding:12px 12px 12px 14px; display:flex; gap:10px; align-items:flex-start; margin-bottom:10px;}
.smart textarea{flex:1; border:none; background:none; outline:none; resize:none; font-size:17px; line-height:1.35; min-height:48px;}
.smart .mic-btn{width:40px; height:40px;}
.preview{display:flex; flex-wrap:wrap; gap:6px; padding:0 4px 14px; min-height:20px;}
.hint{font-size:13px; color:var(--ink-2); line-height:1.5; padding:0 6px 14px;}
.hint code{font-family:var(--font); background:var(--sunk); padding:1px 6px; border-radius:6px; color:var(--ink);}

/* ---------- Voice overlay ---------- */
.voice{position:fixed; inset:0; z-index:200; background:rgba(22,51,44,.97); color:#F3EEDD; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; text-align:center; opacity:0; pointer-events:none; transition:opacity .18s ease;}
.voice.open{opacity:1; pointer-events:auto;}
.voice .orb{width:110px; height:110px; border-radius:50%; background:#F3EEDD; color:var(--navy); display:flex; align-items:center; justify-content:center; position:relative;}
.voice .orb svg{width:42px; height:42px;}
.voice .orb::before,.voice .orb::after{content:''; position:absolute; inset:-14px; border-radius:50%; border:2px solid rgba(243,238,221,.35); animation:pulse 1.6s ease-out infinite;}
.voice .orb::after{animation-delay:.8s;}
@keyframes pulse{from{transform:scale(.85); opacity:1} to{transform:scale(1.35); opacity:0}}
.voice .heard{font-size:22px; line-height:1.35; font-weight:500; margin-top:36px; min-height:60px; max-width:520px;}
.voice .lbl{font-size:13px; letter-spacing:.06em; text-transform:uppercase; opacity:.65; margin-top:26px;}
.voice .examples{font-size:14px; opacity:.6; margin-top:14px; line-height:1.6;}
.voice .stop{margin-top:30px; padding:12px 26px; border-radius:24px; background:rgba(243,238,221,.15); color:#F3EEDD; font-size:16px; font-weight:600;}

/* ---------- Toast ---------- */
.toast{position:fixed; left:50%; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 86px); transform:translate(-50%, 20px); z-index:150;
  background:#201E19; color:#fff; border-radius:14px; padding:12px 14px; font-size:14.5px; line-height:1.35; display:flex; align-items:center; gap:12px;
  max-width:calc(100% - 32px); width:max-content; box-shadow:0 10px 30px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:all .2s ease;}
.toast.show{opacity:1; transform:translate(-50%,0); pointer-events:auto;}
.toast button{color:#9FD3BC; font-weight:650; font-size:14.5px; white-space:nowrap;}

/* ---------- Larger screens ---------- */
@media (min-width:900px){
  #app{max-width:760px;}
  h1.title{font-size:34px;}
}
@media (max-width:360px){
  nav.tabs button span{font-size:9.5px;}
  .stats{grid-template-columns:repeat(3,1fr); gap:6px;} .stat{padding:10px;} .stat b{font-size:19px;}
  .field label{width:96px; font-size:14.5px;}
  .hero .actions button{padding:7px 11px; font-size:13.5px;}
  .hero .actions{gap:6px;}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="back-btn hidden" id="backBtn" onclick="goBack()"></button>
    <div class="top-row">
      <div style="min-width:0">
        <div class="eyebrow" id="eyebrow"></div>
        <h1 class="title" id="title">Bonjour</h1>
      </div>
      <button class="mic-btn" id="micTop" aria-label="Parler à JARVIS" onclick="startVoice()"></button>
    </div>
    <div class="status-line" id="status"></div>
  </header>

  <main>
    <section class="view" id="v-home"></section>
    <section class="view" id="v-plan"></section>
    <section class="view" id="v-tasks"></section>
    <section class="view" id="v-dossiers"></section>
    <section class="view" id="v-more"></section>
    <section class="view" id="v-projects"></section>
    <section class="view" id="v-ideas"></section>
    <section class="view" id="v-news"></section>
    <section class="view" id="v-settings"></section>
    <section class="view" id="v-search"></section>
  </main>
</div>

<button class="fab" id="fab" aria-label="Ajouter" onclick="openCapture()"></button>

<nav class="tabs"><div class="in" id="tabs"></div></nav>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeSheet()"><div class="sheet" id="sheet"></div></div>

<div class="voice" id="voice">
  <div class="orb" id="voiceOrb"></div>
  <div class="lbl" id="voiceLbl">Je vous écoute</div>
  <div class="heard" id="voiceHeard"></div>
  <div class="examples" id="voiceEx">«&nbsp;Appelle le maçon demain à 9h&nbsp;»<br>«&nbsp;Qu'est-ce que j'ai aujourd'hui&nbsp;?&nbsp;»<br>«&nbsp;J'ai fini le relevé Zajac&nbsp;»</div>
  <button class="stop" onclick="stopVoice(true)">Terminer</button>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   JARVIS — application monofichier
   Données : /api/state (Netlify + Neon), clé x-jarvis-key
   ========================================================= */

/* ---------- Icônes ---------- */
const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  plan:'<rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 9.5h18"/>',
  tasks:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/>',
  folder:'<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/>',
  more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  mic:'<rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  back:'<path d="m15 5-7 7 7 7"/>',
  chev:'<path d="m1 1 6 6-6 6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  bulb:'<path d="M9 18h6M10 21.5h4M12 2.5a6.5 6.5 0 0 0-4 11.6c.7.6 1.2 1.4 1.4 2.4h5.2c.2-1 .7-1.8 1.4-2.4A6.5 6.5 0 0 0 12 2.5z"/>',
  project:'<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>',
  news:'<path d="M4 5h13v14a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v10a2 2 0 0 1-2 2M7.5 9h6M7.5 13h6M7.5 17h4"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  repeat:'<path d="M17 2.5 20.5 6 17 9.5"/><path d="M3.5 11.5V10a4 4 0 0 1 4-4h13M7 21.5 3.5 18 7 14.5"/><path d="M20.5 12.5V14a4 4 0 0 1-4 4h-13"/>',
};
function icon(name, attrs){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ${attrs||''}>${ICONS[name]||''}</svg>`; }
const CHEV = '<span class="chev"><svg viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS.chev+'</svg></span>';

/* ---------- Utilitaires ---------- */
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
const pad = n => String(n).padStart(2,'0');
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayYmd(){ return ymd(new Date()); }
function parseYmd(s){ if(!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function daysBetween(a, b){ return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
const DAYS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function dayLabel(s, long){
  if(!s) return '';
  const diff = daysBetween(todayYmd(), s);
  if(diff === 0) return "Aujourd'hui";
  if(diff === 1) return 'Demain';
  if(diff === -1) return 'Hier';
  const d = parseYmd(s);
  if(diff > 1 && diff < 7) return DAYS[d.getDay()].replace(/^./, c=>c.toUpperCase());
  const base = d.getDate() + ' ' + (long ? MONTHS[d.getMonth()] : MONTHS[d.getMonth()].slice(0,4).replace(/\.$/,'')+(MONTHS[d.getMonth()].length>4?'.':''));
  return (long ? DAYS[d.getDay()]+' ' : '') + base + (d.getFullYear() !== new Date().getFullYear() ? ' '+d.getFullYear() : '');
}
function timeToMin(t){ if(!t) return null; const [h,m] = t.split(':').map(Number); return h*60+(m||0); }
function minToTime(m){ m = Math.max(0, Math.round(m)); return pad(Math.floor(m/60)%24)+':'+pad(m%60); }
function nowMin(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function fmtDur(min){ if(!min) return ''; if(min < 60) return min+' min'; const h = Math.floor(min/60), m = min%60; return m ? h+'h'+pad(m) : h+'h'; }
function fmtTimeFr(t){ if(!t) return ''; const [h,m] = t.split(':'); return Number(h)+'h'+(m!=='00'?m:''); }
function fmtShortEUR(n){ n = Math.round(n||0); if(Math.abs(n) >= 1e6) return (n/1e6).toLocaleString('fr-FR',{maximumFractionDigits:1}) + '\u00a0M€'; if(Math.abs(n) >= 1e4) return (n/1e3).toLocaleString('fr-FR',{maximumFractionDigits:1}) + '\u00a0k€'; return n.toLocaleString('fr-FR') + ' €'; }
function fmtEUR(n){ return (Math.round(n||0)).toLocaleString('fr-FR') + ' €'; }
function fold(s){ return String(s||'').split('').map(c => c.normalize('NFD').replace(/[̀-ͯ]/g,'').charAt(0) || c).join('').toLowerCase(); }
function cap(s){ s = String(s||'').trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function safeUrl(u){ return /^https?:\/\//i.test(u||'') ? u : '#'; }
function timeAgo(ts){
  const s = Math.max(0, (Date.now()-ts)/1000);
  if(s < 3600) return 'il y a '+Math.max(1, Math.round(s/60))+' min';
  if(s < 86400) return 'il y a '+Math.round(s/3600)+' h';
  return 'il y a '+Math.round(s/86400)+' j';
}

/* ---------- Données ---------- */
const DEFAULT_SETTINGS = { workStart:'08:00', workEnd:'18:00', useLunch:true, lunchStart:'12:00', lunchEnd:'13:30', morningPersoMinutes:30, eveningPersoMinutes:120, voiceReplies:true, defaultKind:'pro' };
let DATA = { tasksPro:[], tasksPerso:[], projects:[], ideas:[], dossiers:[], settings:{...DEFAULT_SETTINGS} };
let MODE = 'server';            // 'server' | 'local'
const GATE_KEY = 'jarvis-passkey';
const LOCAL_KEY = 'jarvis-local-data';
const CACHE_KEY = 'jarvis-cache';

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function authHeaders(){ const k = lsGet(GATE_KEY); return k ? {'x-jarvis-key':k} : {}; }

function normalize(parsed){
  const d = Object.assign({ tasksPro:[], tasksPerso:[], projects:[], ideas:[], dossiers:[] }, parsed || {});
  ['tasksPro','tasksPerso','projects','ideas','dossiers'].forEach(k => { if(!Array.isArray(d[k])) d[k] = []; });
  d.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
  [...d.tasksPro, ...d.tasksPerso].forEach(t => { if(t.due === '') t.due = null; if(!t.duration) t.duration = 30; if(!t.priority) t.priority = 'normale'; });
  return d;
}

function setStatus(text, isErr){ const el = $('status'); el.textContent = text || ''; el.className = 'status-line' + (isErr ? ' err' : ''); }

async function loadData(){
  setStatus('Chargement…');
  try{
    const res = await fetch('/api/state', { headers: authHeaders(), cache:'no-store' });
    if(res.status === 401){ setStatus(''); showLogin(); return; }
    if(res.status === 404){ return useLocalMode(); }
    if(!res.ok){
      let msg = '';
      try{ const j = await res.json(); msg = j.error || ''; }catch(e){}
      const cached = lsGet(CACHE_KEY);
      if(cached){ DATA = normalize(JSON.parse(cached)); }
      setStatus('Serveur indisponible ('+res.status+') ' + msg + (cached ? ' — copie locale affichée' : ''), true);
      boot(); return;
    }
    MODE = 'server';
    DATA = normalize(await res.json());
    lsSet(CACHE_KEY, JSON.stringify(DATA));
    setStatus('');
  }catch(e){
    const cached = lsGet(CACHE_KEY);
    if(cached){ DATA = normalize(JSON.parse(cached)); setStatus('Hors ligne — dernière copie affichée', true); }
    else { return useLocalMode(); }
  }
  boot();
}
function useLocalMode(){
  MODE = 'local';
  const raw = lsGet(LOCAL_KEY);
  DATA = normalize(raw ? JSON.parse(raw) : null);
  setStatus('Mode aperçu : données gardées sur cet appareil uniquement');
  boot();
}

let saveTimer = null, saving = false;
function save(){
  if(MODE === 'local'){ lsSet(LOCAL_KEY, JSON.stringify(DATA)); return; }
  lsSet(CACHE_KEY, JSON.stringify(DATA));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 350);
}
async function flushSave(){
  if(saving){ saveTimer = setTimeout(flushSave, 300); return; }
  saving = true;
  try{
    const res = await fetch('/api/state', { method:'PUT', headers:Object.assign({'Content-Type':'application/json'}, authHeaders()), body:JSON.stringify(DATA) });
    if(res.status === 401){ showLogin(); }
    else if(!res.ok){ let m=''; try{ m = (await res.json()).error || ''; }catch(e){} setStatus('Échec de sauvegarde ('+res.status+') '+m, true); }
    else if($('status').classList.contains('err')) setStatus('');
  }catch(e){ setStatus('Hors ligne — modification gardée sur l’appareil, renvoi au prochain enregistrement', true); }
  saving = false;
}
window.addEventListener('beforeunload', () => { if(saveTimer && MODE==='server'){ clearTimeout(saveTimer); try{ fetch('/api/state',{method:'PUT',keepalive:true,headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify(DATA)}); }catch(e){} } });

/* ---------- Annulation ---------- */
let undoStack = [];
function snapshot(){ undoStack.push(JSON.stringify(DATA)); if(undoStack.length > 20) undoStack.shift(); }
function undo(){
  const prev = undoStack.pop();
  if(!prev){ toast('Rien à annuler'); return false; }
  DATA = normalize(JSON.parse(prev)); save(); renderAll(); toast('Annulé');
  return true;
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg, actions){
  const el = $('toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (actions||[]).map((a,i) => `<button data-i="${i}">${esc(a.label)}</button>`).join('');
  (actions||[]).forEach((a,i) => { el.querySelector(`[data-i="${i}"]`).onclick = () => { el.classList.remove('show'); a.run(); }; });
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), actions && actions.length ? 6000 : 2600);
}

/* ---------- Tâches : modèle ---------- */
function allTasks(){
  return [...DATA.tasksPro.map(t => ({t, kind:'pro'})), ...DATA.tasksPerso.map(t => ({t, kind:'perso'}))];
}
function findTask(id){
  let t = DATA.tasksPro.find(x => x.id === id); if(t) return {t, kind:'pro'};
  t = DATA.tasksPerso.find(x => x.id === id); if(t) return {t, kind:'perso'};
  return null;
}
function listFor(kind){ return kind === 'pro' ? DATA.tasksPro : DATA.tasksPerso; }
function isLate(t){ return !t.done && t.due && t.due < todayYmd(); }
const PRIO = { haute:0, normale:1, basse:2 };
function sortTasks(a, b){
  const ta = a.t || a, tb = b.t || b;
  if(!!ta.done !== !!tb.done) return ta.done ? 1 : -1;
  const da = ta.due || '9999', db = tb.due || '9999';
  if(da !== db) return da < db ? -1 : 1;
  const sa = ta.startTime || '99', sb = tb.startTime || '99';
  if(sa !== sb) return sa < sb ? -1 : 1;
  return (PRIO[ta.priority]??1) - (PRIO[tb.priority]??1) || (ta.createdAt||0) - (tb.createdAt||0);
}
function addTask(kind, fields){
  const t = Object.assign({ id:uid(), title:'', done:false, due:null, startTime:null, duration:30, priority:'normale', projectId:null, dossierId:null, repeat:'none', notes:'', createdAt:Date.now() }, fields);
  if(kind !== 'pro') t.dossierId = null;
  listFor(kind).unshift(t);
  return t;
}
function nextDue(t){
  const base = t.due || todayYmd();
  switch(t.repeat){
    case 'daily': return addDays(base, 1);
    case 'weekdays': { let n = addDays(base, 1); while([0,6].includes(parseYmd(n).getDay())) n = addDays(n, 1); return n; }
    case 'weekly': return addDays(base, 7);
    case 'monthly': { const d = parseYmd(base); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+1); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); return ymd(d); }
  }
  return null;
}
function toggleTask(id){
  const f = findTask(id); if(!f) return;
  snapshot();
  const t = f.t;
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : null;
  let msg = t.done ? 'Terminé : ' + t.title : 'Rouverte : ' + t.title;
  if(t.done && t.repeat && t.repeat !== 'none'){
    const nd = nextDue(t);
    const exists = listFor(f.kind).some(x => !x.done && x.title === t.title && x.due === nd);
    if(nd && !exists){
      const copy = Object.assign({}, t, { id:uid(), done:false, doneAt:null, due:nd, createdAt:Date.now() });
      listFor(f.kind).unshift(copy);
      msg += ' — prochaine le ' + dayLabel(nd).toLowerCase();
    }
  }
  save(); renderAll();
  toast(msg, [{label:'Annuler', run:undo}]);
}
function deleteTask(id){
  const f = findTask(id); if(!f) return;
  snapshot();
  if(f.kind === 'pro') DATA.tasksPro = DATA.tasksPro.filter(x => x.id !== id);
  else DATA.tasksPerso = DATA.tasksPerso.filter(x => x.id !== id);
  save(); closeSheet(); renderAll();
  toast('Tâche supprimée', [{label:'Annuler', run:undo}]);
}
function duplicates(){
  const seen = new Map(), dup = [];
  allTasks().forEach(({t, kind}) => {
    if(t.done) return;
    const key = kind + '|' + fold(t.title).trim() + '|' + (t.due||'');
    if(seen.has(key)) dup.push(t.id); else seen.set(key, t.id);
  });
  return dup;
}
function removeDuplicates(){
  const ids = new Set(duplicates()); if(!ids.size) return;
  snapshot();
  DATA.tasksPro = DATA.tasksPro.filter(t => !ids.has(t.id));
  DATA.tasksPerso = DATA.tasksPerso.filter(t => !ids.has(t.id));
  save(); renderAll();
  toast(ids.size + ' doublon(s) supprimé(s)', [{label:'Annuler', run:undo}]);
}

/* ---------- Rendu : ligne de tâche ---------- */
function taskRow(entry, opts){
  opts = opts || {};
  const {t, kind} = entry;
  const proj = t.projectId && DATA.projects.find(p => p.id === t.projectId);
  const dos = t.dossierId && DATA.dossiers.find(d => d.id === t.dossierId);
  const bits = [];
  if(!opts.hideKind) bits.push(`<span class="pill ${kind}">${kind === 'pro' ? 'Pro' : 'Perso'}</span>`);
  if(t.due && !opts.hideDate) bits.push(`<span class="${isLate(t) ? 'prio-h' : ''}">${esc(dayLabel(t.due))}</span>`);
  if(t.startTime && !opts.hideTime) bits.push(`<span>${fmtTimeFr(t.startTime)}</span>`);
  if(t.duration) bits.push(`<span>${fmtDur(t.duration)}</span>`);
  if(t.priority === 'haute') bits.push('<span class="prio-h">Urgent</span>');
  if(t.repeat && t.repeat !== 'none') bits.push(`<span title="Récurrente">${icon('repeat','width="13" height="13" style="vertical-align:-2px"')}</span>`);
  if(dos) bits.push(`<span>📁 ${esc(dos.client)}</span>`);
  if(proj) bits.push(`<span>▦ ${esc(proj.name)}</span>`);
  return `<div class="row ${t.done ? 'done' : ''}">
    <button class="check ${kind} ${t.done ? 'on' : ''}" aria-label="Terminer" onclick="toggleTask('${t.id}')"></button>
    <button class="row-body" style="text-align:left" onclick="openTask('${t.id}')">
      <div class="row-title">${esc(t.title)}</div>
      ${bits.length ? `<div class="row-sub">${bits.join('')}</div>` : ''}
    </button>
  </div>`;
}
function taskGroup(entries, emptyText, opts){
  if(!entries.length) return emptyText ? `<div class="group"><div class="empty">${emptyText}</div></div>` : '';
  return `<div class="group">${entries.map(e => taskRow(e, opts)).join('')}</div>`;
}

/* ---------- Planification ---------- */
function buildPlan(day){
  const s = DATA.settings;
  const workStart = timeToMin(s.workStart), workEnd = timeToMin(s.workEnd);
  const lunchStart = s.useLunch ? timeToMin(s.lunchStart) : null, lunchEnd = s.useLunch ? timeToMin(s.lunchEnd) : null;
  let dayStart = workStart - (s.morningPersoMinutes||0);
  const dayEnd = workEnd + (s.eveningPersoMinutes||0);
  const isToday = day === todayYmd();

  const items = allTasks().filter(({t}) => !t.done && t.due === day);
  const pinned = [], proQ = [], persoQ = [];
  items.forEach(e => {
    if(e.t.startTime){ const st = timeToMin(e.t.startTime); pinned.push({...e, start:st, end:st + (e.t.duration||30), pinned:true}); }
    else (e.kind === 'pro' ? proQ : persoQ).push(e);
  });
  const sortQ = (a,b) => (PRIO[a.t.priority]??1) - (PRIO[b.t.priority]??1) || (a.t.createdAt||0) - (b.t.createdAt||0);
  proQ.sort(sortQ); persoQ.sort(sortQ); pinned.sort((a,b) => a.start - b.start);

  const busy = pinned.map(p => ({start:p.start, end:p.end}));
  if(s.useLunch) busy.push({start:lunchStart, end:lunchEnd});
  busy.sort((a,b) => a.start - b.start);
  const merged = [];
  busy.forEach(b => { const last = merged[merged.length-1]; if(last && b.start <= last.end) last.end = Math.max(last.end, b.end); else merged.push({...b}); });

  // Aujourd'hui, on ne planifie rien dans le passé.
  if(isToday) dayStart = Math.max(dayStart, Math.ceil(nowMin()/5)*5);

  const free = []; let cur = dayStart;
  merged.forEach(b => { if(b.start > cur) free.push({start:cur, end:Math.min(b.start, dayEnd)}); cur = Math.max(cur, b.end); });
  if(cur < dayEnd) free.push({start:cur, end:dayEnd});

  const morning = [], work = [], evening = [];
  free.forEach(seg => {
    const clip = (a, b, arr) => { if(b > a) arr.push({start:a, end:b}); };
    clip(seg.start, Math.min(seg.end, workStart), morning);
    clip(Math.max(seg.start, workStart), Math.min(seg.end, workEnd), work);
    clip(Math.max(seg.start, workEnd), seg.end, evening);
  });
  const scheduled = pinned.slice();
  const pack = (segs, q) => segs.forEach(seg => { let c = seg.start; while(q.length && c + (q[0].t.duration||30) <= seg.end){ const e = q.shift(); scheduled.push({...e, start:c, end:c + (e.t.duration||30), pinned:false}); c += e.t.duration||30; } });
  pack(morning, persoQ); pack(work, proQ); pack(evening, persoQ);
  scheduled.sort((a,b) => a.start - b.start);

  const plannedMin = items.reduce((acc, e) => acc + (e.t.duration||30), 0);
  const capacity = Math.max(0, (workEnd - workStart) - (s.useLunch ? (lunchEnd - lunchStart) : 0));
  return { scheduled, overflow:[...proQ, ...persoQ], lunchStart, lunchEnd, workStart, workEnd, plannedMin, capacity };
}

/* ---------- Accueil ---------- */
function currentBlock(){
  const plan = buildPlan(todayYmd());
  const n = nowMin();
  const now = plan.scheduled.find(b => b.start <= n && n < b.end) || null;
  const next = plan.scheduled.find(b => b.start > n) || null;
  return {now, next, plan};
}
function renderHome(){
  const today = todayYmd();
  const todayTasks = allTasks().filter(e => !e.t.done && e.t.due === today).sort(sortTasks);
  const late = allTasks().filter(e => isLate(e.t)).sort(sortTasks);
  const doneToday = allTasks().filter(e => e.t.done && e.t.doneAt && ymd(new Date(e.t.doneAt)) === today).length;
  const {now, next} = currentBlock();
  const focus = now || next;
  const resteDu = DATA.dossiers.reduce((a,d) => a + ((d.montantFacture||0) - (d.montantRegle||0)), 0);

  let hero;

    </div>`;
  } else {
    const msg = todayTasks.length ? 'Les tâches du jour ne rentrent plus dans vos horaires.' : (late.length ? 'Rien de prévu aujourd’hui, mais des tâches en retard attendent.' : 'Rien de prévu pour le reste de la journée.');
    hero = `<div class="hero"><div class="k">Aujourd'hui</div><div class="t">${msg}</div>
      <div class="actions"><button class="primary" onclick="openCapture()">Ajouter une tâche</button><button onclick="startVoice()">Parler</button></div></div>`;
  }

  $('v-home').innerHTML = `
    ${hero}
    <div class="stats">
      <button class="stat" onclick="go('tasks')"><b class="num">${todayTasks.length}</b><span>aujourd'hui</span></button>
      <button class="stat ${late.length ? 'alert' : ''}" onclick="tasksFilter='late'; go('tasks')"><b class="num">${late.length}</b><span>en retard</span></button>
      <button class="stat" onclick="go('dossiers')"><b class="num">${fmtShortEUR(resteDu)}</b><span>reste à encaisser</span></button>
    </div>

    ${late.length ? `<div class="sec-label">En retard <button class="act" onclick="moveLateToToday()">Tout mettre à aujourd'hui</button></div>${taskGroup(late.slice(0,5))}${late.length > 5 ? `<button class="btn ghost" onclick="tasksFilter='late'; go('tasks')">Voir les ${late.length}</button>` : ''}` : ''}

function postpone(id){
  const f = findTask(id); if(!f) return;
  snapshot(); f.t.due = addDays(todayYmd(), 1); save(); renderAll();
  toast('Reportée à demain', [{label:'Annuler', run:undo}]);
}
function moveLateToToday(){
  const late = allTasks().filter(e => isLate(e.t)); if(!late.length) return;
  snapshot(); late.forEach(e => e.t.due = todayYmd()); save(); renderAll();
  toast(late.length + ' tâche(s) déplacée(s) à aujourd’hui', [{label:'Annuler', run:undo}]);

/* ---------- Météo (Open-Meteo, sans clé) ---------- */
let WX = null, wxLoading = false;
const WX_FALLBACK = {lat:45.27, lon:1.77, label:'Corrèze'};
function wxInfo(code){
  if(code === 0) return ['☀️','Ensoleillé'];
  if([1,2].includes(code)) return ['🌤️','Éclaircies'];
  if(code === 3) return ['☁️','Couvert'];
  if([45,48].includes(code)) return ['🌫️','Brouillard'];
  if(code >= 51 && code <= 57) return ['🌦️','Bruine'];
  if(code >= 61 && code <= 67) return ['🌧️','Pluie'];
  if(code >= 71 && code <= 77) return ['🌨️','Neige'];
  if(code >= 80 && code <= 82) return ['🌧️','Averses'];
  if(code >= 85 && code <= 86) return ['🌨️','Averses de neige'];
  if(code >= 95) return ['⛈️','Orage'];
  return ['🌡️','—'];
}
async function fetchWeather(lat, lon, label){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=5`;
  const r = await fetch(url); if(!r.ok) throw new Error('wx');
  const j = await r.json();
  WX = { label, temp:Math.round(j.current.temperature_2m), code:j.current.weather_code, days:j.daily.time.map((t,i) => ({t, code:j.daily.weather_code[i], max:Math.round(j.daily.temperature_2m_max[i]), min:Math.round(j.daily.temperature_2m_min[i]), rain:j.daily.precipitation_probability_max ? j.daily.precipitation_probability_max[i] : null})), at:Date.now() };
  lsSet('jarvis-wx', JSON.stringify(WX));
}
function loadWeather(){
  if(wxLoading || (WX && Date.now() - WX.at < 30*60000)) return Promise.resolve();
  wxLoading = true;
  return new Promise(resolve => {
    const done = () => { wxLoading = false; if(VIEW === 'home') renderWeather('homeWeather'); resolve(); };
    const fallback = () => fetchWeather(WX_FALLBACK.lat, WX_FALLBACK.lon, WX_FALLBACK.label).catch(()=>{}).finally(done);
    if(!navigator.geolocation) return fallback();
    navigator.geolocation.getCurrentPosition(
      p => fetchWeather(p.coords.latitude.toFixed(3), p.coords.longitude.toFixed(3), 'Votre position').catch(()=>{}).finally(done),
      () => fallback(), { timeout:8000, maximumAge:30*60000 });
  });
}
function renderWeather(target){
  const el = $(target); if(!el) return;
  if(!WX){ const c = lsGet('jarvis-wx'); if(c){ try{ WX = JSON.parse(c); }catch(e){} } }
  if(!WX){ el.innerHTML = ''; loadWeather(); return; }
  const [ico, txt] = wxInfo(WX.code); const d0 = WX.days[0] || {};
  el.innerHTML = `<div class="card" style="margin-top:12px">
    <div class="weather"><div class="wx-ico">${ico}</div><div class="temp num">${WX.temp}°</div>
      <div style="flex:1"><div class="desc">${txt}</div><div class="sub">${esc(WX.label)} · ${d0.min}° / ${d0.max}°${d0.rain != null ? ' · pluie ' + d0.rain + ' %' : ''}</div></div></div>
    <div class="wx-days">${WX.days.slice(1,5).map(d => `<div>${DAYS[parseYmd(d.t).getDay()].slice(0,3)}<b>${wxInfo(d.code)[0]}</b>${d.min}°/${d.max}°</div>`).join('')}</div>
  </div>`;
  if(Date.now() - WX.at > 30*60000) loadWeather();
}

/* ---------- Actualité (via /api/news) ---------- */
let NEWS = null, newsLoading = null;
function loadNews(force){
  if(newsLoading) return newsLoading;
  if(!force && NEWS && Date.now() - NEWS.at < 15*60000) return Promise.resolve(NEWS);
  if(!NEWS){ const c = lsGet('jarvis-news'); if(c){ try{ NEWS = JSON.parse(c); }catch(e){} } }
  if(MODE === 'local'){ return Promise.resolve(NEWS); }
  newsLoading = fetch('/api/news', { headers:authHeaders() })
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => { NEWS = Object.assign(j, {at:Date.now()}); lsSet('jarvis-news', JSON.stringify(NEWS)); return NEWS; })
    .catch(e => { if(NEWS) NEWS.error = String(e.message); else NEWS = {error:String(e.message), sections:[]}; return NEWS; })
    .finally(() => { newsLoading = null; });
  return newsLoading;
}
function newsRow(it){

function newsUnavailable(){

function renderHomeNews(){

    const e = $('homeNews'); if(!e) return;
    const items = NEWS && NEWS.sections ? NEWS.sections.flatMap(s => (s.items||[]).slice(0,1).map(i => ({...i, source:s.label + ' · ' + i.source}))) : [];
    e.innerHTML = items.length ? `<div class="group">${items.map(newsRow).join('')}</div>` : `<div class="group"><div class="empty">${newsUnavailable() || 'Aucun titre pour le moment.'}</div></div>`;
  };
  if(NEWS) draw();
  loadNews().then(() => { if(VIEW === 'home') draw(); });
}
let newsTab = 0;
function renderNews(){
  const el = $('v-news');
  const draw = () => {
    const secs = (NEWS && NEWS.sections) || [];
    const msg = newsUnavailable();
    const sec = secs[newsTab] || secs[0];
    el.innerHTML = `
      <div class="toolbar"><div class="seg">${(secs.length ? secs : [{label:'Local'},{label:'France'},{label:'Monde'}]).map((s,i) => `<button class="${i === newsTab ? 'on' : ''}" onclick="newsTab=${i}; renderNews()">${esc(s.label)}</button>`).join('')}</div></div>
      ${sec && sec.items && sec.items.length ? `<div class="group" style="margin-top:12px">${sec.items.map(newsRow).join('')}</div>` : `<div class="group" style="margin-top:12px"><div class="empty">${msg || (newsLoading ? 'Chargement…' : 'Aucun titre dans cette rubrique.')}</div></div>`}
      ${NEWS && NEWS.at ? `<div class="hint" style="margin-top:12px; text-align:center">Mis à jour ${timeAgo(NEWS.at)} · <a href="#" onclick="loadNews(true).then(renderNews); return false;" style="color:var(--navy)">Actualiser</a></div>` : ''}`;
  };
  draw();
  loadNews().then(() => { if(VIEW === 'news') draw(); });
}

/* ---------- Planning ---------- */
let planDay = null, planMonth = false;
function renderPlan(){
  if(!planDay) planDay = todayYmd();
  const today = todayYmd();
  const counts = {};
  allTasks().forEach(({t}) => { if(!t.done && t.due) counts[t.due] = (counts[t.due]||0) + 1; });
  const sel = parseYmd(planDay);
  const monday = addDays(planDay, -((sel.getDay()+6)%7));

  let cal = '';
  if(planMonth){
    const first = new Date(sel.getFullYear(), sel.getMonth(), 1);
    const start = addDays(ymd(first), -((first.getDay()+6)%7));
    let cells = '';
    for(let i = 0; i < 42; i++){
      const d = addDays(start, i), dd = parseYmd(d);
      cells += `<button class="${dd.getMonth() !== sel.getMonth() ? 'out' : ''} ${d === today ? 'today' : ''} ${d === planDay ? 'sel' : ''}" onclick="planDay='${d}'; planMonth=false; renderPlan()">${dd.getDate()}${counts[d] ? '<i></i>' : '<i style="visibility:hidden"></i>'}</button>`;
    }
    cal = `<div class="card" style="padding:12px">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:0 4px">
        <button style="color:var(--navy); font-size:22px; padding:0 8px" onclick="shiftMonth(-1)">‹</button>
        <b style="font-size:16px; text-transform:capitalize">${MONTHS[sel.getMonth()]} ${sel.getFullYear()}</b>
        <button style="color:var(--navy); font-size:22px; padding:0 8px" onclick="shiftMonth(1)">›</button></div>
      <div class="month">${['L','M','M','J','V','S','D'].map(x => `<div class="h">${x}</div>`).join('')}${cells}</div></div>`;
  } else {
    let days = '';
    for(let i = 0; i < 7; i++){
      const d = addDays(monday, i), dd = parseYmd(d);
      days += `<button class="wd ${d === today ? 'today' : ''} ${d === planDay ? 'sel' : ''}" onclick="planDay='${d}'; renderPlan()">${DAYS[dd.getDay()].slice(0,3)}<b>${dd.getDate()}</b><i class="mk ${counts[d] ? '' : 'none'}"></i></button>`;
    }
    cal = `<div style="display:flex; align-items:center; gap:4px">
      <button style="color:var(--navy); font-size:24px; padding:0 4px" onclick="planDay=addDays(planDay,-7); renderPlan()">‹</button>
      <div class="week" style="flex:1">${days}</div>
      <button style="color:var(--navy); font-size:24px; padding:0 4px" onclick="planDay=addDays(planDay,7); renderPlan()">›</button></div>`;
  }

  const plan = buildPlan(planDay);
  const n = nowMin(), isToday = planDay === today;
  let tl = '';
  let lunchShown = !DATA.settings.useLunch;
  plan.scheduled.forEach(b => {
    if(!lunchShown && b.start >= plan.lunchEnd){ tl += lunchRow(plan); lunchShown = true; }
    const isNow = isToday && b.start <= n && n < b.end;
    tl += `<div class="tl-row"><div class="tl-time"><b>${minToTime(b.start)}</b>${minToTime(b.end)}</div>
      <div class="tl-item ${b.kind} ${isNow ? 'now' : ''}">${taskGroup([b], '', {hideDate:true, hideTime:true})}</div></div>`;
  });
  if(!lunchShown && plan.scheduled.length) tl += lunchRow(plan);

  const load = plan.capacity ? Math.round(plan.plannedMin / plan.capacity * 100) : 0;
  $('v-plan').innerHTML = `
    <div class="toolbar"><div class="seg"><button class="${!planMonth ? 'on' : ''}" onclick="planMonth=false; renderPlan()">Semaine</button><button class="${planMonth ? 'on' : ''}" onclick="planMonth=true; renderPlan()">Mois</button></div></div>
    <div style="margin-top:10px">${cal}</div>
    <div class="sec-label" style="text-transform:none; letter-spacing:0; font-size:15px; color:var(--ink)">${esc(dayLabel(planDay, true))}
      <button class="act" onclick="openPlanSettings()">Horaires</button></div>
    ${plan.scheduled.length ? `<div class="hint" style="padding:0 4px 10px">${fmtDur(plan.plannedMin)} prévues · ${load}% de vos heures de travail${planDay !== today ? '' : ' · le planning démarre à partir de maintenant'}</div>` : ''}
    <div class="tl">${tl || `<div class="group"><div class="empty">Rien de prévu ce jour-là.<br>Ajoutez une tâche avec une date, et une heure si elle doit tomber à un moment précis.</div></div>`}</div>
    ${plan.overflow.length ? `<div class="notice"><b>Ne rentre pas dans la journée (${plan.overflow.length})</b>${plan.overflow.map(e => `• <a href="#" onclick="openTask('${e.t.id}'); return false;">${esc(e.t.title)}</a> (${fmtDur(e.t.duration||30)})`).join('<br>')}</div>` : ''}
    <button class="btn ghost" style="margin-top:14px" onclick="openCapture({due:planDay})">Ajouter une tâche ${planDay === today ? "aujourd'hui" : 'ce jour-là'}</button>
  `;
}
function lunchRow(plan){ return `<div class="tl-break"><div class="tl-time">${minToTime(plan.lunchStart)}</div><span class="line"></span><span>Pause déjeuner</span><span class="line"></span></div>`; }
function shiftMonth(n){ const d = parseYmd(planDay); d.setDate(1); d.setMonth(d.getMonth()+n); planDay = ymd(d); renderPlan(); }

/* ---------- Tâches ---------- */
let tasksKind = 'all', tasksFilter = 'open', tasksQuery = '';
function renderTasks(){
  const today = todayYmd(), tomorrow = addDays(today, 1), weekEnd = addDays(today, 7);
  let list = allTasks();
  if(tasksKind !== 'all') list = list.filter(e => e.kind === tasksKind);
  const q = fold(tasksQuery).trim();
  if(q) list = list.filter(e => fold(e.t.title + ' ' + (e.t.notes||'')).includes(q));
  const dupCount = duplicates().length;

  let body = '';
  if(tasksFilter === 'done'){
    const done = list.filter(e => e.t.done).sort((a,b) => (b.t.doneAt||0) - (a.t.doneAt||0)).slice(0, 80);
    body = taskGroup(done, 'Aucune tâche terminée.');
  } else {
    const open = list.filter(e => !e.t.done).sort(sortTasks);
    const groups = [
      ['En retard', open.filter(e => isLate(e.t))],
      ["Aujourd'hui", open.filter(e => e.t.due === today)],
      ['Demain', open.filter(e => e.t.due === tomorrow)],
      ['Cette semaine', open.filter(e => e.t.due && e.t.due > tomorrow && e.t.due <= weekEnd)],
      ['Plus tard', open.filter(e => e.t.due && e.t.due > weekEnd)],
      ['Sans date', open.filter(e => !e.t.due)],
    ].filter(g => tasksFilter !== 'late' || g[0] === 'En retard');
    body = groups.filter(g => g[1].length).map(g => `<div class="sec-label">${g[0]} <span class="num" style="font-weight:500">${g[1].length}</span></div>${taskGroup(g[1], '', {hideDate: g[0] === "Aujourd'hui" || g[0] === 'Demain', hideKind: tasksKind !== 'all'})}`).join('')
      || `<div class="group" style="margin-top:12px"><div class="empty">${q ? 'Aucun résultat.' : (tasksFilter === 'late' ? 'Aucune tâche en retard.' : 'Tout est à jour. Rien à faire.')}</div></div>`;
  }

  $('v-tasks').innerHTML = `
    <div class="toolbar">
      <div class="seg"><button class="${tasksKind === 'all' ? 'on' : ''}" onclick="tasksKind='all'; renderTasks()">Toutes</button><button class="${tasksKind === 'pro' ? 'on' : ''}" onclick="tasksKind='pro'; renderTasks()">Pro</button><button class="${tasksKind === 'perso' ? 'on' : ''}" onclick="tasksKind='perso'; renderTasks()">Perso</button></div>
      <div class="chips"><button class="chip ${tasksFilter === 'open' ? 'on' : ''}" onclick="tasksFilter='open'; renderTasks()">À faire</button><button class="chip ${tasksFilter === 'late' ? 'on' : ''}" onclick="tasksFilter='late'; renderTasks()">En retard</button><button class="chip ${tasksFilter === 'done' ? 'on' : ''}" onclick="tasksFilter='done'; renderTasks()">Terminées</button></div>
    </div>
    <div class="search">${icon('search')}<input id="taskSearch" placeholder="Rechercher" value="${esc(tasksQuery)}" oninput="tasksQuery=this.value; renderTasksKeepFocus()"></div>
    ${dupCount ? `<div class="notice" style="background:var(--navy-soft); color:var(--navy)"><b>${dupCount} tâche(s) en double détectée(s)</b><a href="#" style="font-weight:600" onclick="removeDuplicates(); return false;">Supprimer les doublons</a></div>` : ''}
    ${body}`;
}
function renderTasksKeepFocus(){
  const pos = $('taskSearch') ? $('taskSearch').selectionStart : null;
  renderTasks();
  const i = $('taskSearch'); if(i){ i.focus(); if(pos != null) i.setSelectionRange(pos, pos); }
}

/* ---------- Dossiers ---------- */
const PHASES = ['Prendre contact','Attente maçonnerie','Attente relevé','Prêt','Exe : Charpente','Exe : Couverture','Exe : Zinguerie','Exe : Bardage','Exe : Portes','Exe : Rideau','Terminé'];
let dosFilter = 'active', dosQuery = '';
function dosDone(d){ return /termin/i.test(d.phase||'') || (d.progression||0) >= 100; }
function dosCalc(d){ const ht = d.montantHT||0, f = d.montantFacture||0, r = d.montantRegle||0; return { resteARegler:f - r, resteAFacturer:ht - f, pctFact: ht ? Math.round(f/ht*100) : 0 }; }
function renderDossiers(){
  const all = DATA.dossiers.slice().sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
  let list = all;
  if(dosFilter === 'active') list = list.filter(d => !dosDone(d));
  if(dosFilter === 'done') list = list.filter(dosDone);
  if(dosFilter === 'due') list = list.filter(d => dosCalc(d).resteARegler > 0);
  const q = fold(dosQuery).trim();
  if(q) list = list.filter(d => fold([d.client, d.devis, d.phase, d.lot].join(' ')).includes(q));
  const sum = f => list.reduce((a,d) => a + (f(d)||0), 0);
  const ht = sum(d => d.montantHT), fact = sum(d => d.montantFacture), reg = sum(d => d.montantRegle);
  const openTasks = id => DATA.tasksPro.filter(t => t.dossierId === id && !t.done).length;

  $('v-dossiers').innerHTML = `
    <div class="toolbar"><div class="chips">
      <button class="chip ${dosFilter === 'active' ? 'on' : ''}" onclick="dosFilter='active'; renderDossiers()">En cours</button>
      <button class="chip ${dosFilter === 'due' ? 'on' : ''}" onclick="dosFilter='due'; renderDossiers()">À encaisser</button>
      <button class="chip ${dosFilter === 'done' ? 'on' : ''}" onclick="dosFilter='done'; renderDossiers()">Terminés</button>
      <button class="chip ${dosFilter === 'all' ? 'on' : ''}" onclick="dosFilter='all'; renderDossiers()">Tous</button>
    </div></div>
    <div class="search">${icon('search')}<input id="dosSearch" placeholder="Client, n° de devis, phase…" value="${esc(dosQuery)}" oninput="dosQuery=this.value; const p=this.selectionStart; renderDossiers(); const i=$('dosSearch'); i.focus(); i.setSelectionRange(p,p);"></div>
    ${list.length ? `<div class="totals">
      <div class="full"><small>${list.length} dossier${list.length > 1 ? 's' : ''} · montant HT</small><b>${fmtEUR(ht)}</b></div>
      <div><small>Facturé</small><b>${fmtEUR(fact)}</b></div><div><small>Réglé</small><b>${fmtEUR(reg)}</b></div>
      <div><small>Reste à régler</small><b>${fmtEUR(fact - reg)}</b></div><div><small>Reste à facturer</small><b>${fmtEUR(ht - fact)}</b></div>
    </div>` : ''}
    <div class="sec-label">Dossiers <button class="act" onclick="openDossier(null)">+ Nouveau</button></div>
    ${list.length ? `<div class="group">${list.map(d => { const c = dosCalc(d); const ot = openTasks(d.id); return `<button class="row" onclick="openDossier('${d.id}')">
      <div class="row-body"><div class="row-title"><b style="font-weight:600">${esc(d.client || 'Sans nom')}</b></div>
      <div class="row-sub"><span class="pill ${dosDone(d) ? 'ok' : 'navy'}">${esc(d.phase || '—')}</span>${d.devis ? `<span>Devis ${esc(d.devis)}</span>` : ''}<span class="num">${fmtEUR(d.montantHT)}</span>${ot ? `<span>${ot} tâche${ot > 1 ? 's' : ''}</span>` : ''}</div>
      <div class="bar"><i style="width:${Math.max(0, Math.min(100, d.progression||0))}%"></i></div>
      ${c.resteARegler > 0 ? `<div class="money due" style="margin-top:6px">Reste à régler ${fmtEUR(c.resteARegler)}</div>` : ''}</div>${CHEV}</button>`; }).join('')}</div>`
      : `<div class="group"><div class="empty">${DATA.dossiers.length ? 'Aucun dossier dans ce filtre.' : 'Aucun dossier pour l’instant.<br>Créez-en un, ou importez votre fichier depuis Réglages.'}</div></div>`}
  `;
}
function openDossier(id){
  const d = id ? DATA.dossiers.find(x => x.id === id) : { id:null, client:'', devis:'', dateDevis:'', lot:'', boisM3:null, couvertureM2:null, zingMl:null, phase:'Prendre contact', progression:0, montantHT:0, montantFacture:0, montantRegle:0 };
  if(!d) return;
  const c = dosCalc(d);
  const tasks = id ? DATA.tasksPro.filter(t => t.dossierId === id).map(t => ({t, kind:'pro'})).sort(sortTasks) : [];
  const num = (k, v, step) => `<input type="number" inputmode="decimal" step="${step||'any'}" id="d-${k}" value="${v == null ? '' : v}">`;
  openSheet(id ? (d.client || 'Dossier') : 'Nouveau dossier', `
    <div class="form">
      <div class="field"><label>Client</label><input id="d-client" value="${esc(d.client)}" placeholder="Nom du client"></div>
      <div class="field"><label>N° devis</label><input id="d-devis" value="${esc(d.devis)}"></div>
      <div class="field"><label>Date du devis</label><input type="date" id="d-dateDevis" value="${d.dateDevis||''}"></div>
      <div class="field"><label>Lot</label><input id="d-lot" value="${esc(d.lot)}" placeholder="C/C/B/Z/P"></div>
    </div>
    <div class="form-label">Avancement</div>
    <div class="form">
      <div class="field"><label>Phase</label><select id="d-phase">${PHASES.concat(PHASES.includes(d.phase) || !d.phase ? [] : [d.phase]).map(p => `<option ${p === d.phase ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></div>
      <div class="field"><label>Avancement %</label>${num('progression', d.progression||0, 5)}</div>
    </div>
    <div class="form-label">Quantités</div>
    <div class="form">
      <div class="field"><label>Bois (m³)</label>${num('boisM3', d.boisM3)}</div>
      <div class="field"><label>Couverture (m²)</label>${num('couvertureM2', d.couvertureM2)}</div>
      <div class="field"><label>Zinguerie (ml)</label>${num('zingMl', d.zingMl)}</div>
    </div>
    <div class="form-label">Montants (€)</div>
    <div class="form">
      <div class="field"><label>Montant HT</label>${num('montantHT', d.montantHT||0)}</div>
      <div class="field"><label>Facturé</label>${num('montantFacture', d.montantFacture||0)}</div>
      <div class="field"><label>Réglé</label>${num('montantRegle', d.montantRegle||0)}</div>
      ${id ? `<div class="field"><label style="color:var(--ink-2)">Calculé</label><div class="money" style="flex:1; text-align:right; line-height:1.5">Reste à régler <b>${fmtEUR(c.resteARegler)}</b><br>Reste à facturer <b>${fmtEUR(c.resteAFacturer)}</b> · facturé ${c.pctFact} %</div></div>` : ''}
    </div>
    ${id ? `<div class="form-label">Tâches liées</div>${taskGroup(tasks, 'Aucune tâche liée à ce dossier.', {hideKind:true})}
      <button class="btn ghost" onclick="closeSheet(); setTimeout(()=>openCapture({kind:'pro', dossierId:'${id}'}), 230)">Ajouter une tâche à ce dossier</button>
      <button class="btn danger" style="margin-top:22px" onclick="deleteDossier('${id}')">Supprimer le dossier</button>` : ''}
  `, { primary:'Enregistrer', onPrimary:() => saveDossier(id) });
}
function saveDossier(id){
  const v = k => $('d-' + k).value;
  const n = k => v(k) === '' ? null : parseFloat(String(v(k)).replace(',', '.'));
  const client = v('client').trim();
  if(!client){ toast('Indiquez au moins le client'); return; }
  snapshot();
  const fields = { client, devis:v('devis').trim(), dateDevis:v('dateDevis') || null, lot:v('lot').trim(), phase:v('phase'),
    progression:Math.max(0, Math.min(100, n('progression')||0)), boisM3:n('boisM3'), couvertureM2:n('couvertureM2'), zingMl:n('zingMl'),
    montantHT:n('montantHT')||0, montantFacture:n('montantFacture')||0, montantRegle:n('montantRegle')||0 };
  if(fields.phase === 'Terminé' && fields.progression < 100) fields.progression = 100;
  if(id){ Object.assign(DATA.dossiers.find(x => x.id === id), fields); }
  else DATA.dossiers.push(Object.assign({ id:uid(), createdAt:Date.now() }, fields));
  save(); closeSheet(); renderAll(); toast(id ? 'Dossier enregistré' : 'Dossier créé');
}
function deleteDossier(id){
  snapshot();
  DATA.dossiers = DATA.dossiers.filter(d => d.id !== id);
  DATA.tasksPro.forEach(t => { if(t.dossierId === id) t.dossierId = null; });
  save(); closeSheet(); renderAll(); toast('Dossier supprimé', [{label:'Annuler', run:undo}]);
}

let searchQuery = '';
function renderSearch(){
  const q = fold(searchQuery).trim();
  let res = '';
  if(q){
    const tasks = allTasks().filter(e => fold(e.t.title + ' ' + (e.t.notes||'')).includes(q)).sort(sortTasks).slice(0, 30);
    const dos = DATA.dossiers.filter(d => fold([d.client, d.devis, d.phase].join(' ')).includes(q));

      + (pro.length ? `<div class="sec-label">Projets</div><div class="group flat">${pro.map(p => `<button class="row" onclick="openProject('${p.id}')"><div class="row-body"><div class="row-title">${esc(p.name)}</div></div>${CHEV}</button>`).join('')}</div>` : '')
      + (ide.length ? `<div class="sec-label">Idées</div><div class="group flat">${ide.map(i => `<button class="row" onclick="openIdea('${i.id}')"><div class="row-body"><div class="row-title">${esc(i.text)}</div></div>${CHEV}</button>`).join('')}</div>` : '')
      || '<div class="group" style="margin-top:12px"><div class="empty">Aucun résultat.</div></div>';
  }
  $('v-search').innerHTML = `<div class="search">${icon('search')}<input id="gSearch" placeholder="Tâche, dossier, projet, idée…" value="${esc(searchQuery)}" oninput="searchQuery=this.value; const p=this.selectionStart; renderSearch(); const i=$('gSearch'); i.focus(); i.setSelectionRange(p,p);"></div>${res}`;
  if(!q) setTimeout(() => $('gSearch') && $('gSearch').focus(), 50);
}

const PSTATUS = { en_cours:'En cours', en_pause:'En pause', termine:'Terminé' };
function projectStats(p){
  const tasks = allTasks().filter(e => e.t.projectId === p.id);
  const done = tasks.filter(e => e.t.done).length;

function exportData(){
  const blob = new Blob([JSON.stringify(DATA, null, 1)], {type:'application/json'});

  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);

function readJsonFile(input, cb){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{ cb(JSON.parse(r.result)); }catch(e){ toast('Fichier illisible : il faut un fichier .json'); } input.value = ''; };
  r.readAsText(f);
}
function importBackup(input){
  readJsonFile(input, j => {
    if(!j || typeof j !== 'object' || !(j.tasksPro || j.tasksPerso)){ toast('Ce fichier ne ressemble pas à une sauvegarde JARVIS'); return; }
    if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
    snapshot(); DATA = normalize(j); save(); renderAll(); toast('Sauvegarde restaurée', [{label:'Annuler', run:undo}]);
  });
}
function importDossiers(input){
  readJsonFile(input, j => {
    const list = Array.isArray(j) ? j : (j && Array.isArray(j.dossiers) ? j.dossiers : null);
    if(!list){ toast('Format non reconnu'); return; }
    snapshot();
    const known = new Set(DATA.dossiers.map(d => d.id)); let n = 0;
    list.forEach(d => { if(d && d.client && !known.has(d.id)){ DATA.dossiers.push(Object.assign({}, d, { id:d.id || uid(), createdAt:d.createdAt || Date.now() })); known.add(d.id); n++; } });
    save(); renderAll(); toast(n + ' dossier(s) importé(s)', [{label:'Annuler', run:undo}]);
  });
}

const REPEATS = { none:'Jamais', daily:'Tous les jours', weekdays:'Jours ouvrés', weekly:'Chaque semaine', monthly:'Chaque mois' };
function taskFormHtml(t, kind){
  const durs = [15,30,45,60,90,120,240];

    <div class="form">
      <div class="field stack"><label>Titre</label><input id="t-title" value="${esc(t.title)}" placeholder="Que faut-il faire ?"></div>
    </div>

    <div class="form">
      <div class="field"><label>Date</label><input type="date" id="t-due" value="${t.due||''}"></div>
      <div class="presets" style="padding-top:2px">${[['Aujourd’hui',0],['Demain',1],['Dans 1 sem.',7]].map(([l,n]) => `<button type="button" onclick="$('t-due').value=addDays(todayYmd(),${n})">${l}</button>`).join('')}<button type="button" onclick="$('t-due').value=''">Sans date</button></div>
      <div class="field"><label>Heure fixe</label><input type="time" id="t-start" value="${t.startTime||''}"></div>
      <div class="field"><label>Durée</label><input type="number" id="t-dur" value="${t.duration||30}" step="5" min="5" style="max-width:90px"><span style="color:var(--ink-2)">min</span></div>
      <div class="presets">${durs.map(m => `<button type="button" class="${(t.duration||30) === m ? 'on' : ''}" onclick="$('t-dur').value=${m}; this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on')); this.classList.add('on')">${fmtDur(m)}</button>`).join('')}</div>
    </div>
    <div class="form">
      <div class="field"><label>Priorité</label><select id="t-prio">${[['haute','Urgent'],['normale','Normale'],['basse','Basse']].map(([v,l]) => `<option value="${v}" ${t.priority === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Répéter</label><select id="t-repeat">${Object.entries(REPEATS).map(([v,l]) => `<option value="${v}" ${(t.repeat||'none') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Projet</label><select id="t-proj"><option value="">Aucun</option>${DATA.projects.map(p => `<option value="${p.id}" ${t.projectId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
      <div class="field ${kind === 'pro' ? '' : 'hidden'}" id="t-dos-row"><label>Dossier</label><select id="t-dos"><option value="">Aucun</option>${DATA.dossiers.slice().sort((a,b) => (a.client||'').localeCompare(b.client||'')).map(d => `<option value="${d.id}" ${t.dossierId === d.id ? 'selected' : ''}>${esc(d.client)}${d.devis ? ' — ' + esc(d.devis) : ''}</option>`).join('')}</select></div>
      <div class="field stack"><label>Notes</label><textarea id="t-notes" rows="2" placeholder="Détails, adresse, numéro…">${esc(t.notes||'')}</textarea></div>
    </div>`;
}
let formKind = 'pro';
function setFormKind(k){
  formKind = k;
  document.querySelectorAll('#t-kind button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  const r = $('t-dos-row'); if(r) r.classList.toggle('hidden', k !== 'pro');
}
function readTaskForm(){
  return { title:$('t-title').value.trim(), due:$('t-due').value || null, startTime:$('t-start').value || null,
    duration:Math.max(5, parseInt($('t-dur').value,10)||30), priority:$('t-prio').value, repeat:$('t-repeat').value,
    projectId:$('t-proj').value || null, dossierId:formKind === 'pro' ? ($('t-dos').value || null) : null, notes:$('t-notes').value.trim() };
}
function openTask(id){
  const f = findTask(id); if(!f) return;
  formKind = f.kind;
  openSheet('Tâche', taskFormHtml(f.t, f.kind) + `
    <div class="btn-row"><button class="btn ghost" onclick="toggleTask('${id}'); closeSheet()">${f.t.done ? 'Rouvrir' : 'Marquer terminée'}</button></div>
    <button class="btn danger" style="margin-top:22px" onclick="deleteTask('${id}')">Supprimer la tâche</button>`,
    { primary:'Enregistrer', onPrimary:() => saveTask(id) });
}
function saveTask(id){
  const f = findTask(id); if(!f) return;
  const v = readTaskForm(); if(!v.title){ toast('Le titre est vide'); return; }
  snapshot();
  Object.assign(f.t, v);
  if(formKind !== f.kind){
    listFor(f.kind).splice(listFor(f.kind).indexOf(f.t), 1);
    if(formKind !== 'pro') f.t.dossierId = null;
    listFor(formKind).unshift(f.t);
  }
  save(); closeSheet(); renderAll(); toast('Tâche enregistrée');
}

/* ---------- Saisie rapide (texte ou voix) ---------- */
let captureCtx = {};
function openCapture(ctx){
  captureCtx = ctx || {};
  const type = captureCtx.type || 'tache';
  if(type === 'idee'){
    openSheet('Nouvelle idée', `<div class="smart"><textarea id="c-text" placeholder="Votre idée…" rows="3"></textarea><button class="mic-btn" onclick="dictateInto('c-text')">${icon('mic')}</button></div>`,
      { primary:'Ajouter', onPrimary:() => { const txt = $('c-text').value.trim(); if(!txt) return; snapshot(); DATA.ideas.unshift({ id:uid(), text:cap(txt), tag:'autre', projectId:captureCtx.projectId || null, createdAt:Date.now() }); save(); closeSheet(); renderAll(); toast('Idée notée', [{label:'Annuler', run:undo}]); } });
    setTimeout(() => $('c-text') && $('c-text').focus(), 250);
    return;
  }
  formKind = captureCtx.kind || DATA.settings.defaultKind || 'pro';
  const base = { title:'', due:captureCtx.due || null, startTime:null, duration:30, priority:'normale', repeat:'none', projectId:captureCtx.projectId || null, dossierId:captureCtx.dossierId || null, notes:'' };
  openSheet('Nouvelle tâche', `
    <div class="smart"><textarea id="c-text" rows="2" placeholder="Ex. : appeler le maçon demain à 9h pendant 15 min" oninput="smartPreview()"></textarea><button class="mic-btn" onclick="dictateInto('c-text')">${icon('mic')}</button></div>
    <div class="preview" id="c-preview"></div>
    <div class="hint">Écrivez ou dictez naturellement : la date, l'heure, la durée, « pro » ou « perso », « urgent », « tous les lundis », le nom d'un dossier… sont reconnus. Vous pouvez aussi compléter les champs ci-dessous.</div>
    <details id="c-details"><summary style="font-size:15px; color:var(--navy); font-weight:600; padding:4px 6px 14px; cursor:pointer">Détails</summary>${taskFormHtml(base, formKind)}</details>
  `, { primary:'Ajouter', onPrimary:submitCapture });
  setTimeout(() => $('c-text') && $('c-text').focus(), 250);
  smartPreview();
}
function smartPreview(){
  const el = $('c-preview'); if(!el) return;
  const txt = $('c-text').value.trim();
  if(!txt){ el.innerHTML = ''; return; }
  const cmd = parseTask(txt);
  const bits = [`<span class="pill ${cmd.kind}">${cmd.kind === 'pro' ? 'Pro' : 'Perso'}${cmd.kindGuessed ? ' ?' : ''}</span>`];
  if(cmd.due) bits.push(`<span class="pill">${esc(dayLabel(cmd.due))}</span>`);
  if(cmd.startTime) bits.push(`<span class="pill">${fmtTimeFr(cmd.startTime)}</span>`);
  if(cmd.duration) bits.push(`<span class="pill">${fmtDur(cmd.duration)}</span>`);
  if(cmd.priority === 'haute') bits.push('<span class="pill late">Urgent</span>');
  if(cmd.repeat !== 'none') bits.push(`<span class="pill">${REPEATS[cmd.repeat]}</span>`);
  const dos = cmd.dossierId && DATA.dossiers.find(d => d.id === cmd.dossierId); if(dos) bits.push(`<span class="pill">📁 ${esc(dos.client)}</span>`);
  const pr = cmd.projectId && DATA.projects.find(p => p.id === cmd.projectId); if(pr) bits.push(`<span class="pill">▦ ${esc(pr.name)}</span>`);
  el.innerHTML = `<span style="font-size:14px; font-weight:600; width:100%; padding:0 2px 2px">${esc(cmd.title || '…')}</span>` + bits.join('');
}
function submitCapture(){
  const txt = $('c-text').value.trim();
  const detailsOpen = $('c-details') && $('c-details').open;
  const form = readTaskForm();
  if(!txt && !form.title){ toast('Écrivez ou dictez la tâche'); return; }
  let fields;
  if(txt){
    const cmd = parseTask(txt);
    const kind = (detailsOpen && formKind) ? formKind : cmd.kind;
    fields = { title:cmd.title || txt, due:cmd.due, startTime:cmd.startTime, duration:cmd.duration || 30, priority:cmd.priority, repeat:cmd.repeat, projectId:cmd.projectId || captureCtx.projectId || null, dossierId:cmd.dossierId || captureCtx.dossierId || null, notes:'' };
    if(captureCtx.due && !fields.due) fields.due = captureCtx.due;
    if(detailsOpen){ // les champs remplis à la main l'emportent
      if(form.due) fields.due = form.due; if(form.startTime) fields.startTime = form.startTime;
      if(form.duration !== 30) fields.duration = form.duration; if(form.priority !== 'normale') fields.priority = form.priority;
      if(form.repeat !== 'none') fields.repeat = form.repeat; if(form.projectId) fields.projectId = form.projectId;
      if(form.dossierId) fields.dossierId = form.dossierId; if(form.notes) fields.notes = form.notes;
    }
    if(captureCtx.kind) formKind = captureCtx.kind; else formKind = kind;
  } else { fields = form; }
  snapshot();
  const t = addTask(formKind, fields);
  save(); closeSheet(); renderAll();
  toast('Ajoutée : ' + t.title + (t.due ? ' · ' + dayLabel(t.due).toLowerCase() : ''), [{label:'Modifier', run:() => openTask(t.id)}, {label:'Annuler', run:undo}]);
}

/* =========================================================
   COMPRÉHENSION DU LANGAGE (français)
