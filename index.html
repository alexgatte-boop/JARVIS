const NUMS = { un:1, une:1, deux:2, trois:3, quatre:4, cinq:5, six:6, sept:7, huit:8, neuf:9, dix:10, onze:11, douze:12, quinze:15, vingt:20, trente:30, quarante:40, cinquante:50 };
const MONTH_RX = 'janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre';
const DAY_RX = 'lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche';
const num = s => NUMS[s] != null ? NUMS[s] : parseInt(s, 10);

/* Petit moteur : on cherche des motifs dans le texte « plié » (sans accents, minuscules),
   et on retire les morceaux reconnus du titre, qui garde sa casse et ses accents d'origine. */
function makeCutter(text){
  const orig = String(text);
  const folded = fold(orig);
  const keep = new Array(orig.length).fill(true);
  return {
    folded,
    take(rx){
      const r = new RegExp(rx.source, rx.flags.includes('g') ? rx.flags : rx.flags + 'g');
      let m, first = null;
      while((m = r.exec(folded))){
        if(m[0] === ''){ r.lastIndex++; continue; }
        let free = true; for(let i = m.index; i < m.index + m[0].length; i++) if(!keep[i]){ free = false; break; }
        if(!free) continue;
        for(let i = m.index; i < m.index + m[0].length; i++) keep[i] = false;
        first = m; break;
      }
      return first;
    },
    rest(){
      let s = orig.split('').map((c,i) => keep[i] ? c : ' ').join('');
      s = s.replace(/\s+/g, ' ').trim();
      s = s.replace(/^(?:[,;:.!-]|\s)+|(?:[,;:.!-]|\s)+$/g, '');
      // mots de liaison orphelins en début / fin
      for(let i = 0; i < 3; i++){
        s = s.replace(/^(?:de|d'|du|des|pour|a|à|le|la|les|l'|un|une|et|que|qu'|faut|il)\s+/i, '').replace(/\s+(?:de|d'|du|pour|a|à|le|la|les|et|au|aux|en|ce|cette|vers|pendant|durant)$/i, '').trim();
      }
      return s;
    }
  };
}

function resolveWeekday(name, explicitNext){
  const target = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'].indexOf(name);
  const today = new Date(); let diff = (target - today.getDay() + 7) % 7;
  if(diff === 0) diff = 7;
  return addDays(todayYmd(), diff);
}

function parseTask(text){
  const c = makeCutter(text);
  const out = { title:'', kind:null, kindGuessed:false, due:null, startTime:null, duration:null, priority:'normale', repeat:'none', projectId:null, dossierId:null };

  // Verbes de commande en tête
  c.take(/^\s*(?:jarvis[, ]+)?(?:(?:peux[- ]tu|tu peux|pourrais[- ]tu)\s+)?(?:cree(?:r|z)?|nouvelle)\s+(?:une?\s+)?(?:nouvelle\s+)?(?:tache|rappel)\s*(?:a faire\s*)?(?:de|d'|:)?\s*/);
  c.take(/^\s*(?:jarvis[, ]+)?(?:(?:peux[- ]tu|tu peux|pourrais[- ]tu)\s+)?(?:ajoute(?:r|z)?|mets?|note(?:r|z)?|programme(?:r|z)?|planifie(?:r|z)?|rappelle[- ]moi(?:\s+(?:de|d'))?|il faut (?:que je|que j'|)|je dois|pense a|n'oublie pas (?:de|d'))\b\s*(?:une?\s+)?(?:(?:nouvelle\s+)?(?:tache|taches|rappel|chose)\s*)?(?:a faire\s*)?(?:de|d'|:)?\s*/);
  c.take(/^\s*(?:une?\s+)?(?:tache|rappel)\s*(?:de|d'|:)?\s*/);

  // Type
  if(c.take(/\b(?:perso|personnelle?|privee?|maison)\b/)) out.kind = 'perso';
  else if(c.take(/\b(?:pro|professionnelle?|boulot|travail|taf)\b/)) out.kind = 'pro';
  c.take(/\btache\b/);

  // Récurrence
  let m;
  if(c.take(/\b(?:tous les jours|chaque jour|quotidiennement|chaque matin|tous les matins)\b/)) out.repeat = 'daily';
  else if(c.take(/\b(?:en semaine|les jours ouvres|jours ouvrables|du lundi au vendredi)\b/)) out.repeat = 'weekdays';
  else if((m = c.take(new RegExp('\\b(?:tous les|chaque)\\s+(' + DAY_RX + ')s?\\b')))){ out.repeat = 'weekly'; out.due = resolveWeekday(m[1]); if(out.due === addDays(todayYmd(),7) && parseYmd(todayYmd()).getDay() === ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'].indexOf(m[1])) out.due = todayYmd(); }
  else if(c.take(/\b(?:chaque semaine|toutes les semaines|hebdomadaire(?:ment)?)\b/)) out.repeat = 'weekly';
  else if(c.take(/\b(?:chaque mois|tous les mois|mensuel(?:lement)?)\b/)) out.repeat = 'monthly';

  // Priorité
  if(c.take(/\b(?:pas urgent|pas presse|priorite basse|basse priorite|quand j'ai le temps|si j'ai le temps)\b/)) out.priority = 'basse';
  else if(c.take(/\b(?:(?:tres |c'est )?urgent(?:e|issime)?|en urgence|important(?:e)?|priorite haute|haute priorite|en priorite|prioritaire|asap|au plus vite)\b/)) out.priority = 'haute';

  // Durée
  if((m = c.take(/\b(?:pendant|durant|duree(?: de)?|pour|ca prend|qui prend|prevoir)\s+(?:environ\s+)?(\d+|une?|deux|trois|quatre|cinq|dix|quinze|vingt|trente|quarante|cinquante)\s*(h|heures?|min|minutes?|mn)\s*(\d{1,2})?\b/))){
    const n = num(m[1]); out.duration = /^h/.test(m[2]) ? n*60 + (m[3] ? parseInt(m[3],10) : 0) : n;
  } else if((m = c.take(/\b(?:pendant|durant|pour)\s+(?:une\s+)?demi[- ]heure\b|\bune demi[- ]heure\b/))){ out.duration = 30; }
  else if((m = c.take(/\b(?:pendant|durant|pour)\s+(?:une\s+)?(?:heure et demie|1h30)\b/))){ out.duration = 90; }
  else if((m = c.take(/\b(\d+|dix|quinze|vingt|trente|quarante|cinquante)\s*(?:min|minutes|mn)\b/))){ out.duration = num(m[1]); }
  else if((m = c.take(/\b(?:pendant|durant)\s+(?:la\s+)?(?:journee|toute la journee)\b/))){ out.duration = 480; }
  else if((m = c.take(/\b(?:pendant|durant)\s+(?:la\s+)?(?:matinee|apres-midi|apres midi)\b/))){ out.duration = 240; }

  // Date
  const today = todayYmd();
  if(c.take(/\bapres[- ]demain\b/)) out.due = addDays(today, 2);
  else if(c.take(/\bdemain\b/)) out.due = addDays(today, 1);
  else if(c.take(/\b(?:aujourd'hui|aujourd hui|ce soir|ce matin|cet apres[- ]midi|cette apres[- ]midi|tout a l'heure|dans la journee|ce midi)\b/)) out.due = today;
  else if((m = c.take(/\bdans\s+(\d+|une?|deux|trois|quatre|cinq|six|sept|huit|dix|quinze)\s+(jours?|semaines?|mois)\b/))){
    const n = num(m[1]); out.due = /^s/.test(m[2]) ? addDays(today, n*7) : /^m/.test(m[2]) ? (() => { const d = parseYmd(today); d.setMonth(d.getMonth()+n); return ymd(d); })() : addDays(today, n);
  }
  else if(c.take(/\b(?:la semaine prochaine|semaine prochaine)\b/)){ const d = parseYmd(today); out.due = addDays(today, ((8 - d.getDay()) % 7) || 7); }
  else if(c.take(/\b(?:ce week-end|ce weekend|ce week end)\b/)){ out.due = resolveWeekday('samedi'); if(parseYmd(today).getDay() === 6) out.due = today; }
  else if((m = c.take(new RegExp('\\b(?:le\\s+|ce\\s+)?(' + DAY_RX + ')(?:\\s+(prochain|qui vient|en huit))?\\b')))){
    out.due = resolveWeekday(m[1]); if(m[2] === 'en huit') out.due = addDays(out.due, 7);
  }
  else if((m = c.take(new RegExp('\\b(?:le\\s+)?(1er|\\d{1,2})\\s+(' + MONTH_RX + ')(?:\\s+(\\d{4}))?\\b')))){
    const day = m[1] === '1er' ? 1 : parseInt(m[1],10), mon = MONTH_RX.split('|').indexOf(m[2]);
    const now = parseYmd(today); let y = m[3] ? parseInt(m[3],10) : now.getFullYear();
    let d = new Date(y, mon, day); if(!m[3] && ymd(d) < today) d = new Date(y+1, mon, day); out.due = ymd(d);
  }
  else if((m = c.take(/\b(?:le\s+)?(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/))){
    const now = parseYmd(today); let y = m[3] ? (m[3].length === 2 ? 2000 + parseInt(m[3],10) : parseInt(m[3],10)) : now.getFullYear();
    let d = new Date(y, parseInt(m[2],10)-1, parseInt(m[1],10)); if(!m[3] && ymd(d) < today) d.setFullYear(y+1); out.due = ymd(d);
  }
  else if((m = c.take(/\ble\s+(1er|\d{1,2})\b(?!\s*(?:h|heures?|min))/))){
    const day = m[1] === '1er' ? 1 : parseInt(m[1],10), now = parseYmd(today);
    let d = new Date(now.getFullYear(), now.getMonth(), day); if(ymd(d) < today) d = new Date(now.getFullYear(), now.getMonth()+1, day); out.due = ymd(d);
  }

  // Heure
  if((m = c.take(/\b(?:a|vers|pour|des|avant)?\s*(\d{1,2})\s*(?:h|heures?|:)\s*(\d{2}|et demie|et quart|moins le quart)?\b/))){
    let h = parseInt(m[1],10), mi = 0;
    if(m[2] === 'et demie') mi = 30; else if(m[2] === 'et quart') mi = 15; else if(m[2] === 'moins le quart'){ h -= 1; mi = 45; } else if(m[2]) mi = parseInt(m[2],10);
    if(/\b(?:du soir|ce soir|de l'apres[- ]midi)\b/.test(c.folded) && h < 12) h += 12;
    if(h >= 0 && h < 24 && mi < 60) out.startTime = pad(h) + ':' + pad(mi);
  } else if(c.take(/\b(?:a|vers|pour)?\s*midi\b/)) out.startTime = '12:00';
  c.take(/\b(?:du soir|de l'apres[- ]midi|du matin)\b/);
  if(out.startTime && !out.due) out.due = timeToMin(out.startTime) > nowMin() ? today : addDays(today, 1);

  // Dossier / projet explicites (« pour le dossier X », « projet Y »)
  if((m = c.take(/\b(?:pour|dans|sur|du|au)?\s*(?:le\s+|la\s+)?(?:dossier|chantier|client)\s+(.+?)$/))){
    const d = bestMatch(DATA.dossiers, x => x.client, m[1]); if(d){ out.dossierId = d.id; if(!out.kind){ out.kind = 'pro'; } }
  }
  if((m = c.take(/\b(?:pour|dans|sur|du)?\s*(?:le\s+)?projet\s+(.+?)$/))){
    const p = bestMatch(DATA.projects, x => x.name, m[1]); if(p) out.projectId = p.id;
  }
  out.title = cap(c.rest());

  // Dossier implicite : le nom d'un client apparaît dans le titre
  if(!out.dossierId){
    const ft = fold(out.title);
    const hit = DATA.dossiers.filter(d => d.client && fold(d.client).length >= 4 && new RegExp('\\b' + fold(d.client).replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b').test(ft));
    if(hit.length === 1){ out.dossierId = hit[0].id; if(!out.kind) out.kind = 'pro'; }
  }
  if(!out.kind){ out.kind = DATA.settings.defaultKind || 'pro'; out.kindGuessed = true; }
  if(out.kind !== 'pro') out.dossierId = null;
  return out;
}

/* Rapprochement approximatif d'un nom (dossier, projet, tâche) */
function words(s){ return fold(s).replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 1 && !['le','la','les','de','du','des','un','une','et','pour','mon','ma','mes','avec','au','aux','d','l'].includes(w)); }
function score(a, b){
  const wa = words(a), wb = words(b); if(!wa.length || !wb.length) return 0;
  let hit = 0; wa.forEach(w => { if(wb.some(x => x === w || (w.length > 3 && (x.startsWith(w) || w.startsWith(x))))) hit++; });
  return hit / Math.max(wa.length, 1);
}
function bestMatch(list, getName, query, min){
  let best = null, bs = 0;
  list.forEach(x => { const s = Math.max(score(query, getName(x)), score(getName(x), query) * 0.9); if(s > bs){ bs = s; best = x; } });
  return bs >= (min == null ? 0.5 : min) ? best : null;
}

/* Interprétation d'une phrase complète → action */
function interpret(text){
  const f = fold(text).trim().replace(/[?!.]+$/, '');
  let m;
  if(!f) return { intent:'none' };
  if(/^(?:annule(?:r)?|annule ca|defais|retour en arriere)\b/.test(f)) return { intent:'undo' };
  if(/^(?:merci|ok|d'accord|c'est bon)\b/.test(f) && f.split(' ').length <= 3) return { intent:'thanks' };
  if((m = f.match(/^(?:ouvre|affiche|montre(?:-moi)?|va (?:sur|dans|a|aux?)|aller (?:sur|a|aux?))\s+(?:le |la |les |l'|mes |mon |ma )?(accueil|planning|agenda|calendrier|taches?|dossiers?|projets?|idees?|actu\w*|infos|reglages|parametres|recherche)/))){
    const map = { accueil:'home', planning:'plan', agenda:'plan', calendrier:'plan', tache:'tasks', taches:'tasks', dossier:'dossiers', dossiers:'dossiers', projet:'projects', projets:'projects', idee:'ideas', idees:'ideas', infos:'news', reglages:'settings', parametres:'settings', recherche:'search' };
    return { intent:'nav', view: map[m[1]] || (m[1].startsWith('actu') ? 'news' : 'home') };
  }
  if(/\b(?:meteo|quel temps|temps qu'il fait|il fait (?:beau|froid|chaud)|va-t-il pleuvoir|il va pleuvoir|pleuvoir)\b/.test(f)) return { intent:'weather', day: /\bdemain\b/.test(f) ? 1 : 0 };
  if(/\b(?:actus?|actualites?|les infos|quoi de neuf dans le monde|les nouvelles|journal)\b/.test(f) && !/\b(?:ajoute|note|tache)\b/.test(f)) return { intent:'news' };
  if(/\b(?:prochaine (?:tache|action|chose)|je fais quoi|qu'est-ce que je fais|par quoi je commence|quoi faire maintenant|et maintenant)\b/.test(f)) return { intent:'next' };
  if(/\b(?:en retard|retards?)\b/.test(f) && /\b(?:quoi|quelles?|qu'est|combien|mes|liste)\b/.test(f)) return { intent:'late' };
  if((m = f.match(/\b(?:qu'est-ce que j'ai|qu'ai-je|j'ai quoi|quoi de prevu|qu'est-ce qui est prevu|mon programme|ma journee|mon planning|mes taches|c'est quoi le programme|resume)\b(.*)$/))){
    const r = m[1] || '';
    let day = todayYmd();
    if(/apres[- ]demain/.test(r)) day = addDays(day, 2); else if(/demain/.test(r)) day = addDays(day, 1);
    else if((m = r.match(new RegExp('(' + DAY_RX + ')')))) day = resolveWeekday(m[1]);
    else if(/semaine/.test(r)) return { intent:'week' };
    return { intent:'agenda', day };
  }
  if(/\b(?:combien|reste a encaisser|reste a regler|reste a facturer|chiffre|ca en cours)\b/.test(f) && /\b(?:dossiers?|encaisser|facturer|regler|chiffre)\b/.test(f)) return { intent:'money' };
  if((m = f.match(/^(?:j'ai (?:fini|termine|fait)|c'est fait(?: pour)?|termine(?:r)?|coche(?:r)?|valide(?:r)?|marque(?:r)?(?: comme)? (?:fait|termine)e?|fini)\s*[:,]?\s*(.*)$/))){
    return { intent:'complete', query: m[1].replace(/^(?:la tache|le|la|les|l'|mon|ma)\s+/, '') };
  }
  if((m = f.match(/^(?:supprime(?:r)?|efface(?:r)?|enleve(?:r)?|retire(?:r)?)\s+(?:la tache\s+)?(.+)$/))) return { intent:'delete', query:m[1].replace(/^(?:le|la|les|l')\s+/, '') };
  if((m = f.match(/^(?:decale(?:r)?|reporte(?:r)?|deplace(?:r)?|repousse(?:r)?)\s+(.+)$/))) return { intent:'move', raw:text };
  if((m = f.match(/^(?:(?:note(?:r|z)?|ajoute(?:r|z)?|nouvelle|j'ai une)\s+(?:une\s+)?idee|idee)\s*(?::|de|d'|que|qu')?\s*(.*)$/))){
    const start = text.length - m[1].length;
    return { intent:'idea', text:cap(text.slice(start).replace(/^[\s:,]+/, '')) };
  }
  if((m = f.match(/^(?:nouveau|cree(?:r)?|ajoute(?:r)?|commence(?:r)?)\s+(?:un\s+)?(?:nouveau\s+)?projet\s*(?::|de|d')?\s*(.*)$/))){
    return { intent:'project', name:cap(text.slice(text.length - m[1].length)) };
  }
  if((m = f.match(/^(?:nouveau|cree(?:r)?|ajoute(?:r)?|ouvre(?:r)?)\s+(?:un\s+)?(?:nouveau\s+)?dossier\s*(?:client|pour|de|:)?\s*(.*)$/))){
    return { intent:'dossier', client:text.slice(text.length - m[1].length).trim().toUpperCase() };
  }
  return { intent:'task', parsed:parseTask(text) };
}

/* Recherche d'une tâche ouverte par ses mots */
function findOpenTask(query){
  const open = allTasks().filter(e => !e.t.done);
  const today = todayYmd();
  let best = null, bs = 0;
  open.forEach(e => {
    let s = score(query, e.t.title);
    if(e.t.due === today) s += 0.05;
    if(s > bs){ bs = s; best = e; }
  });
  return bs >= 0.5 ? best : null;
}

/* Exécution d'une phrase (voix ou texte) */
let lastExec = { text:'', at:0 };
function execute(text, spoken){
  text = String(text||'').trim();
  if(!text) return '';
  if(fold(text) === fold(lastExec.text) && Date.now() - lastExec.at < 4000) return ''; // anti-doublon
  lastExec = { text, at:Date.now() };
  const cmd = interpret(text);
  let reply = '';
  switch(cmd.intent){
    case 'undo': reply = undo() ? 'C’est annulé.' : 'Il n’y a rien à annuler.'; break;
    case 'thanks': reply = 'Avec plaisir.'; break;
    case 'nav': go(cmd.view); reply = ''; break;
    case 'weather': reply = weatherSentence(cmd.day); go('home'); break;
    case 'news': go('news'); reply = newsSentence(); break;
    case 'next': {
      const {now, next} = currentBlock();
      if(now) reply = 'En ce moment : ' + now.t.title + ', jusqu’à ' + fmtTimeFr(minToTime(now.end)) + '.' + (next ? ' Ensuite, à ' + fmtTimeFr(minToTime(next.start)) + ' : ' + next.t.title + '.' : '');
      else if(next) reply = 'Prochaine tâche à ' + fmtTimeFr(minToTime(next.start)) + ' : ' + next.t.title + '.';
      else { const late = allTasks().filter(e => isLate(e.t)).sort(sortTasks); reply = late.length ? 'Plus rien de planifié aujourd’hui. La plus ancienne tâche en retard : ' + late[0].t.title + '.' : 'Plus rien de prévu aujourd’hui.'; }
      go('home'); break;
    }
    case 'late': {
      const late = allTasks().filter(e => isLate(e.t)).sort(sortTasks);
      reply = late.length ? late.length + ' tâche' + (late.length > 1 ? 's' : '') + ' en retard : ' + late.slice(0,4).map(e => e.t.title).join(', ') + (late.length > 4 ? ', et ' + (late.length - 4) + ' autres.' : '.') : 'Aucune tâche en retard.';
      tasksFilter = 'late'; go('tasks'); break;
    }
    case 'agenda': reply = agendaSentence(cmd.day); planDay = cmd.day; planMonth = false; go('plan'); break;
    case 'week': {
      let n = 0, mins = 0; for(let i = 0; i < 7; i++){ const d = addDays(todayYmd(), i); allTasks().forEach(e => { if(!e.t.done && e.t.due === d){ n++; mins += e.t.duration||30; } }); }
      reply = 'Sur les 7 prochains jours : ' + n + ' tâche' + (n > 1 ? 's' : '') + ', environ ' + fmtDur(mins).replace('h', ' heures ') + '.';
      go('plan'); break;
    }
    case 'money': {
      const ra = DATA.dossiers.reduce((a,d) => a + (d.montantFacture||0) - (d.montantRegle||0), 0);
      const rf = DATA.dossiers.reduce((a,d) => a + (d.montantHT||0) - (d.montantFacture||0), 0);
      reply = 'Reste à encaisser : ' + fmtEUR(ra) + '. Reste à facturer : ' + fmtEUR(rf) + '.'; dosFilter = 'due'; go('dossiers'); break;
    }
    case 'complete': {
      const e = findOpenTask(cmd.query);
      if(e){ toggleTask(e.t.id); reply = 'C’est noté, « ' + e.t.title + ' » est terminée.'; }
      else reply = 'Je n’ai pas trouvé de tâche correspondant à « ' + cmd.query + ' ».';
      break;
    }
    case 'delete': {
      const e = findOpenTask(cmd.query);
      if(e){ deleteTask(e.t.id); reply = '« ' + e.t.title + ' » est supprimée. Dites « annule » pour revenir en arrière.'; }
      else reply = 'Je n’ai pas trouvé cette tâche.';
      break;
    }
    case 'move': {
      const p = parseTask(cmd.raw.replace(/^\s*\S+\s+/, ''));
      const e = findOpenTask(p.title);
      if(e && (p.due || p.startTime)){
        snapshot(); if(p.due) e.t.due = p.due; if(p.startTime) e.t.startTime = p.startTime; save(); renderAll();
        reply = '« ' + e.t.title + ' » est déplacée à ' + dayLabel(e.t.due).toLowerCase() + (e.t.startTime ? ' à ' + fmtTimeFr(e.t.startTime) : '') + '.';
        toast(reply, [{label:'Annuler', run:undo}]);
      } else reply = e ? 'À quel moment voulez-vous la déplacer ?' : 'Je n’ai pas trouvé cette tâche.';
      break;
    }
    case 'idea': {
      if(!cmd.text){ reply = 'Quelle est votre idée ?'; break; }
      snapshot(); DATA.ideas.unshift({ id:uid(), text:cmd.text, tag:'autre', projectId:null, createdAt:Date.now() }); save(); renderAll();
      reply = 'Idée notée.'; toast('Idée notée : ' + cmd.text, [{label:'Annuler', run:undo}]); break;
    }
    case 'project': {
      if(!cmd.name){ reply = 'Quel est le nom du projet ?'; break; }
      snapshot(); const p = { id:uid(), name:cmd.name, description:'', status:'en_cours', progress:0, createdAt:Date.now(), estimateMinutes:0 }; DATA.projects.unshift(p); save(); renderAll();
      reply = 'Projet « ' + cmd.name + ' » créé.'; toast(reply, [{label:'Ouvrir', run:() => openProject(p.id)}, {label:'Annuler', run:undo}]); break;
    }
    case 'dossier': {
      if(!cmd.client){ openDossier(null); reply = 'Remplissez la fiche du dossier.'; break; }
      snapshot(); const d = { id:uid(), client:cmd.client, devis:'', dateDevis:null, lot:'', phase:'Prendre contact', progression:0, montantHT:0, montantFacture:0, montantRegle:0, boisM3:null, couvertureM2:null, zingMl:null, createdAt:Date.now() };
      DATA.dossiers.push(d); save(); renderAll(); reply = 'Dossier ' + cmd.client + ' créé.'; toast(reply, [{label:'Compléter', run:() => openDossier(d.id)}, {label:'Annuler', run:undo}]); break;
    }
    case 'task': {
      const p = cmd.parsed;
      if(!p.title || p.title.length < 2){ reply = 'Je n’ai pas compris. Dites par exemple : appeler le maçon demain à 9 heures.'; break; }
      snapshot();
      const t = addTask(p.kind, { title:p.title, due:p.due, startTime:p.startTime, duration:p.duration || 30, priority:p.priority, repeat:p.repeat, projectId:p.projectId, dossierId:p.dossierId });
      save(); renderAll();
      const when = (t.due ? ' ' + (daysBetween(todayYmd(), t.due) >= 2 && daysBetween(todayYmd(), t.due) < 7 ? dayLabel(t.due).toLowerCase() : dayLabel(t.due, true).toLowerCase()) : '') + (t.startTime ? ' à ' + fmtTimeFr(t.startTime) : '');
      reply = 'Ajouté en ' + (p.kind === 'pro' ? 'pro' : 'perso') + ' : ' + t.title + when + '.';
      const actions = [{label:'Modifier', run:() => openTask(t.id)}, {label:'Annuler', run:undo}];
      if(p.kindGuessed) actions.unshift({label: p.kind === 'pro' ? '→ Perso' : '→ Pro', run:() => { const f = findTask(t.id); if(!f) return; formKind = f.kind === 'pro' ? 'perso' : 'pro'; listFor(f.kind).splice(listFor(f.kind).indexOf(f.t),1); if(formKind !== 'pro') f.t.dossierId = null; listFor(formKind).unshift(f.t); save(); renderAll(); toast('Passée en ' + formKind); }});
      toast(reply, actions);
      break;
    }
  }
  if(reply && spoken) speak(reply);
  return reply;
}
function agendaSentence(day){
  const plan = buildPlan(day);
  const items = allTasks().filter(e => !e.t.done && e.t.due === day);
  const label = day === todayYmd() ? 'Aujourd’hui' : dayLabel(day, true);
  if(!items.length) return label + ', rien de prévu.';
  const list = plan.scheduled.slice(0, 5).map(b => (b.pinned ? 'à ' + fmtTimeFr(minToTime(b.start)) + ', ' : '') + b.t.title);
  return label + ', ' + items.length + ' tâche' + (items.length > 1 ? 's' : '') + ' : ' + list.join(' ; ') + (items.length > 5 ? ', et ' + (items.length - 5) + ' autres' : '') + '.' + (plan.overflow.length ? ' Attention, ' + plan.overflow.length + ' ne rentre' + (plan.overflow.length > 1 ? 'nt' : '') + ' pas dans la journée.' : '');
}
function weatherSentence(dayOffset){
  if(!WX){ loadWeather(); return 'Je récupère la météo, redemandez-moi dans un instant.'; }
  if(dayOffset === 1 && WX.days[1]){ const d = WX.days[1]; return 'Demain : ' + wxInfo(d.code)[1].toLowerCase() + ', de ' + d.min + ' à ' + d.max + ' degrés' + (d.rain != null ? ', ' + d.rain + ' % de risque de pluie' : '') + '.'; }
  const d = WX.days[0] || {}; return 'Il fait ' + WX.temp + ' degrés, ' + wxInfo(WX.code)[1].toLowerCase() + '. Aujourd’hui entre ' + d.min + ' et ' + d.max + ' degrés' + (d.rain != null ? ', ' + d.rain + ' % de risque de pluie' : '') + '.';
}
function newsSentence(){
  const secs = NEWS && NEWS.sections ? NEWS.sections.filter(s => s.items && s.items.length) : [];
  if(!secs.length) return 'Voici l’actualité.';
  return secs.slice(0,3).map(s => s.label + ' : ' + s.items[0].title).join('. ') + '.';
}

/* =========================================================
   VOIX
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recFinal = '', recTarget = null, recActive = false;
function speak(text){
  if(!DATA.settings.voiceReplies || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/«|»/g, ''));
    u.lang = 'fr-FR'; u.rate = 1.04;
    const v = speechSynthesis.getVoices().find(v => /^fr(-|_)FR/i.test(v.lang) && /amelie|thomas|audrey|google|premium|enhanced/i.test(v.name)) || speechSynthesis.getVoices().find(v => /^fr/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function startVoice(){ listen(null); }
function dictateInto(id){ listen(id); }
function listen(targetId){
  if(!SR){
    if(targetId){ const el = $(targetId); el && el.focus(); toast('Utilisez le micro du clavier pour dicter'); }
    else { openCapture(); setTimeout(() => toast('Dictée directe indisponible ici : utilisez le micro du clavier'), 300); }
    return;
  }
  if(recActive){ stopVoice(true); return; }
  recTarget = targetId; recFinal = '';
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
  rec = new SR(); rec.lang = 'fr-FR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  $('voiceHeard').textContent = ''; $('voiceLbl').textContent = 'Je vous écoute'; $('voiceEx').classList.toggle('hidden', !!targetId);
  $('voice').classList.add('open'); recActive = true;
  rec.onresult = e => {
    let interim = ''; recFinal = '';
    for(let i = 0; i < e.results.length; i++){ const r = e.results[i]; if(r.isFinal) recFinal += r[0].transcript; else interim += r[0].transcript; }
    $('voiceHeard').textContent = (recFinal + ' ' + interim).trim();
  };
  rec.onerror = e => {
    recActive = false;
    const msg = e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'Autorisez le micro pour ce site dans les réglages du navigateur.' : e.error === 'no-speech' ? 'Je n’ai rien entendu.' : 'La dictée a rencontré un problème (' + e.error + ').';
    $('voiceLbl').textContent = msg; setTimeout(() => $('voice').classList.remove('open'), 1600);
  };
  rec.onend = () => { if(recActive) finishVoice(); };
  try{ rec.start(); }catch(e){ recActive = false; $('voice').classList.remove('open'); toast('Impossible de démarrer le micro'); }
}
function stopVoice(apply){ if(!rec) return; if(apply){ try{ rec.stop(); }catch(e){ finishVoice(); } } else { recActive = false; try{ rec.abort(); }catch(e){} $('voice').classList.remove('open'); } }
function finishVoice(){
  recActive = false;
  const heard = (recFinal || $('voiceHeard').textContent || '').trim();
  if(recTarget){
    $('voice').classList.remove('open');
    const el = $(recTarget); if(el && heard){ el.value = (el.value ? el.value.trim() + ' ' : '') + heard; el.dispatchEvent(new Event('input')); }
    return;
  }
  if(!heard){ $('voiceLbl').textContent = 'Je n’ai rien entendu.'; setTimeout(() => $('voice').classList.remove('open'), 1100); return; }
  const reply = execute(heard, true);
  $('voiceLbl').textContent = 'Compris'; $('voiceHeard').textContent = reply || heard;
  setTimeout(() => $('voice').classList.remove('open'), reply ? Math.min(4200, 1200 + reply.length * 28) : 600);
}

/* ---------- Connexion ---------- */
function showLogin(){
  openSheet('JARVIS est protégé', `
    <div class="form"><div class="field stack"><label>Code d'accès</label><input id="gate" type="password" autocomplete="current-password" placeholder="Votre code" onkeydown="if(event.key==='Enter') submitLogin()"></div></div>
    <div id="gateErr" class="hint hidden" style="color:var(--late)">Code incorrect.</div>
    <button class="btn" onclick="submitLogin()">Entrer</button>`, { cancel:' ' });
  document.querySelector('.sheet-nav button').disabled = true;
  setTimeout(() => $('gate') && $('gate').focus(), 250);
}
async function submitLogin(){
  lsSet(GATE_KEY, $('gate').value);
  const r = await fetch('/api/state', { headers:authHeaders() }).catch(() => null);
  if(!r || r.status === 401){ $('gateErr').classList.remove('hidden'); return; }
  closeSheet(); loadData();
}

/* ---------- Démarrage ---------- */
let booted = false;
function boot(){
  if(!booted){
    booted = true;
    $('micTop').innerHTML = icon('mic'); $('voiceOrb').innerHTML = icon('mic'); $('fab').innerHTML = icon('plus', 'stroke-width="2.4"');
    document.addEventListener('keydown', e => {
      if(e.key === 'Escape') closeSheet();
      if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openCapture(); }
    });
    setInterval(() => { if(!document.hidden && !$('overlay').classList.contains('open') && (VIEW === 'home' || VIEW === 'plan')) renderView(VIEW); }, 60000);
    document.addEventListener('visibilitychange', () => { if(!document.hidden && MODE === 'server' && !$('overlay').classList.contains('open')) refreshFromServer(); });
    if('speechSynthesis' in window) try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }catch(e){}
  }
  go(VIEW);
  loadWeather();
}
async function refreshFromServer(){
  if(saveTimer || saving) return;
  try{ const r = await fetch('/api/state', { headers:authHeaders(), cache:'no-store' }); if(r.ok){ DATA = normalize(await r.json()); lsSet(CACHE_KEY, JSON.stringify(DATA)); renderAll(); } }catch(e){}
}
loadData();
